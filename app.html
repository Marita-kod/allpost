<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Postkollen — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0F0D1A; --bg2: #1A1730; --bg3: #26215C;
      --purple: #534AB7; --purple-light: #7F77DD; --purple-pale: #AFA9EC; --purple-muted: #3C3489;
      --teal: #1D9E75; --teal-light: #9FE1CB;
      --text: #FFFFFF; --text-muted: #888780; --text-dim: #5F5E5A; --text-darker: #444441;
      --border: rgba(255,255,255,0.07);
      --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; height: 100vh; display: flex; overflow: hidden; }

    /* SIDEBAR */
    .sidebar { width: 220px; background: var(--bg2); border-right: 0.5px solid var(--border); display: flex; flex-direction: column; padding: 1.25rem 0.75rem; flex-shrink: 0; }
    .sidebar-logo { display: flex; align-items: center; gap: 9px; padding: 0 0.5rem 1.25rem; border-bottom: 0.5px solid var(--border); margin-bottom: 0.75rem; }
    .logo-text { font-size: 16px; font-weight: 500; color: #fff; letter-spacing: -0.3px; }
    .logo-text span { color: var(--purple-pale); }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--text-muted); cursor: pointer; transition: all 0.12s; font-size: 13px; margin-bottom: 2px; }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav-item.active { background: var(--bg3); color: var(--purple-pale); font-weight: 500; }
    .nav-item i { font-size: 16px; }
    .sidebar-bottom { margin-top: auto; border-top: 0.5px solid var(--border); padding-top: 0.75rem; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: var(--purple-pale); flex-shrink: 0; }

    /* MAIN */
    .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 0.5px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 10; }
    .topbar-title { font-size: 16px; font-weight: 500; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 7px; font-size: 13px; font-family: var(--font); cursor: pointer; transition: all 0.12s; border: none; }
    .btn-primary { background: var(--purple); color: #fff; }
    .btn-primary:hover { background: var(--purple-muted); }
    .btn-ghost { background: transparent; border: 0.5px solid var(--border); color: var(--text-muted); }
    .btn-ghost:hover { background: var(--bg2); color: var(--text); }
    .content { padding: 1.5rem; flex: 1; }

    /* METRICS */
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.25rem; }
    .metric { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; }
    .metric-label { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
    .metric-val { font-size: 22px; font-weight: 500; }
    .metric-sub { font-size: 11px; color: var(--text-darker); margin-top: 3px; }

    /* CARDS */
    .card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .card-title { font-size: 13px; font-weight: 500; color: var(--text); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* TABLE */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 11px; font-weight: 500; color: var(--text-dim); padding: 0 8px 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 10px 8px; border-top: 0.5px solid var(--border); color: var(--text-muted); vertical-align: middle; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .td-main { color: var(--text); }

    /* BADGES */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; white-space: nowrap; }
    .b-transit { background: rgba(55,138,221,0.15); color: #85B7EB; }
    .b-delivered { background: rgba(29,158,117,0.15); color: var(--teal-light); }
    .b-pending { background: rgba(186,117,23,0.15); color: #FAC775; }
    .b-customs { background: rgba(216,90,48,0.15); color: #F0997B; }

    /* DOT */
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    /* SEARCH */
    .search { display: flex; align-items: center; gap: 8px; background: var(--bg3); border: 0.5px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 1rem; }
    .search input { background: transparent; border: none; outline: none; font-size: 13px; color: var(--text); font-family: var(--font); flex: 1; }
    .search input::placeholder { color: var(--text-darker); }

    /* FILTERS */
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
    .filter { padding: 5px 12px; border-radius: 99px; font-size: 12px; border: 0.5px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font-family: var(--font); transition: all 0.12s; }
    .filter.active { background: var(--bg3); color: var(--purple-pale); border-color: var(--purple-light); }

    /* NOTIF */
    .notif { display: flex; gap: 10px; padding: 10px 0; border-top: 0.5px solid var(--border); align-items: flex-start; }
    .notif:first-child { border-top: none; }
    .notif-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .ni-green { background: rgba(29,158,117,0.15); }
    .ni-blue { background: rgba(55,138,221,0.15); }
    .ni-amber { background: rgba(186,117,23,0.15); }
    .ni-red { background: rgba(226,75,74,0.15); }
    .notif-body { font-size: 13px; color: var(--text); line-height: 1.5; }
    .notif-time { font-size: 11px; color: var(--text-darker); margin-top: 2px; }

    /* INVOICE */
    .inv-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-top: 0.5px solid var(--border); }
    .inv-row:first-child { border-top: none; }
    .inv-name { font-size: 13px; color: var(--text); }
    .inv-meta { font-size: 11px; color: var(--text-darker); margin-top: 2px; }
    .inv-amount { font-size: 14px; font-weight: 500; }
    .amt-out { color: #F09595; }
    .amt-in { color: var(--teal-light); }
    .inv-due { font-size: 11px; color: var(--text-darker); text-align: right; margin-top: 2px; }

    /* FORM */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 14px; padding: 1.5rem; width: 460px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 16px; font-weight: 500; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; }
    .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; line-height: 1; }
    .tabs { display: flex; gap: 4px; background: var(--bg3); border-radius: 8px; padding: 4px; margin-bottom: 1.25rem; }
    .tab { flex: 1; padding: 7px; text-align: center; font-size: 12px; color: var(--text-dim); border-radius: 6px; cursor: pointer; font-family: var(--font); border: none; background: transparent; transition: all 0.12s; }
    .tab.active { background: var(--bg2); color: var(--purple-pale); font-weight: 500; }
    .field { margin-bottom: 12px; }
    .field label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px; }
    .field input, .field select, .field textarea { width: 100%; background: var(--bg3); border: 0.5px solid rgba(255,255,255,0.1); border-radius: 7px; padding: 9px 12px; font-size: 13px; color: var(--text); font-family: var(--font); outline: none; transition: border-color 0.12s; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--purple-light); }
    .field input::placeholder, .field textarea::placeholder { color: var(--text-darker); }
    .field select option { background: var(--bg2); }
    .field textarea { min-height: 60px; resize: none; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .carrier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .carrier-chip { border: 0.5px solid var(--border); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; font-size: 11px; color: var(--text-muted); font-family: var(--font); background: transparent; transition: all 0.12s; }
    .carrier-chip.sel { border-color: var(--purple-light); background: var(--bg3); color: var(--purple-pale); }
    .mono { font-family: var(--mono); }
    .recognized { display: inline-block; font-size: 10px; background: rgba(29,158,117,0.2); color: var(--teal-light); padding: 2px 7px; border-radius: 99px; margin-left: 8px; }

    /* SETTINGS */
    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 0.5px solid var(--border); }
    .setting-row:first-child { border-top: none; }
    .toggle { width: 36px; height: 20px; border-radius: 99px; cursor: pointer; position: relative; transition: background 0.2s; border: none; flex-shrink: 0; }
    .toggle.on { background: var(--purple); }
    .toggle.off { background: var(--bg3); }
    .toggle::after { content:''; position: absolute; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: white; transition: left 0.2s; }
    .toggle.on::after { left: 18px; }
    .toggle.off::after { left: 2px; }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-logo">
    <svg width="42" height="42" viewBox="0 0 52 52" fill="none"><polygon points="26,4 48,16 48,38 26,50 4,38 4,16" fill="#3C3489"/><polygon points="26,4 48,16 26,28 4,16" fill="#534AB7"/><polygon points="48,16 48,38 26,50 26,28" fill="#26215C"/><polygon points="4,16 26,28 26,50 4,38" fill="#2D2570"/><rect x="13" y="18" width="22" height="15" rx="2" fill="#FFCD00"/><path d="M13 20L24 27L35 20" stroke="#B8920A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="33" cy="31" r="5.5" fill="#1D9E75"/><path d="M30.2 31l2 2 3.2-3.2" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    <span class="logo-text">Post<span>kollen</span></span>
  </div>
  <div class="nav-item active" onclick="showView('dashboard')">📦 Översikt</div>
  <div class="nav-item" onclick="showView('shipments')">🚚 Försändelser</div>
  <div class="nav-item" onclick="showView('invoices')">🧾 Kostnader</div>
  <div class="nav-item" onclick="showView('notifications')">🔔 Notifieringar</div>
  <div class="sidebar-bottom">
    <div class="nav-item" onclick="showView('settings')">⚙️ Inställningar</div>
    <div class="nav-item" onclick="logout()" style="cursor:pointer;margin-bottom:4px;"><i class="ti ti-logout"></i> Logga ut</div>
    <div class="nav-item" style="margin-top:4px;">
      <div class="avatar">AL</div>
      <span style="font-size:12px;">Anna Lindqvist</span>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="main"></div>

<!-- MODAL: Lägg till försändelse -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-title">
      Lägg till försändelse
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-track" onclick="switchModalTab('track')">Spårningsnummer</button>
      <button class="tab" id="tab-manual" onclick="switchModalTab('manual')">Manuell</button>
    </div>

    <div id="modal-track">
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">Transportör / plattform</div>
      <div class="carrier-grid" id="carrier-grid" style="grid-template-columns:repeat(3,1fr);">
        <button class="carrier-chip sel" onclick="selectCarrier(this,'PostNord')"><span class="dot" style="background:#D85A30"></span>PostNord</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'DHL')"><span class="dot" style="background:#EF9F27"></span>DHL</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'UPS')"><span class="dot" style="background:#633806"></span>UPS</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'FedEx')"><span class="dot" style="background:#185FA5"></span>FedEx</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'Budbee')"><span class="dot" style="background:#1D9E75"></span>Budbee</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'Instabox')"><span class="dot" style="background:#534AB7"></span>Instabox</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'Vinted')"><span class="dot" style="background:#09B1BA"></span>Vinted</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'Marketplace')"><span class="dot" style="background:#1877F2"></span>Marketplace</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'Tradera')"><span class="dot" style="background:#E8392A"></span>Tradera</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'Earlybird')"><span class="dot" style="background:#FF6B35"></span>Earlybird</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'Annat')" id="annat-chip" style="grid-column:span 3;flex-direction:row;justify-content:center;gap:8px;"><span class="dot" style="background:#888780"></span>Annat</button>
      </div>
      <div id="annat-wrap" style="display:none;" class="field">
        <label>Ange transportör / plattform</label>
        <input id="annat-name" placeholder="t.ex. Blocket, Wish, eget…" />
      </div>
      <div class="field">
        <label>Spårningsnummer <span id="recognized" class="recognized" style="display:none;">Igenkänd ✓</span></label>
        <input id="track-nr" class="mono" placeholder="t.ex. SE123456789SE" oninput="onTrack(this.value)" />
      </div>
      <div class="field">
        <label>Smeknamn (valfritt)</label>
        <input id="track-name" placeholder="t.ex. Jacka från ASOS" />
      </div>
      <div class="field">
        <label>Notering</label>
        <textarea id="track-note" placeholder="Egna anteckningar…"></textarea>
      </div>
      <div class="row2">
        <div class="field"><label>Kostnad (kr)</label><input id="track-cost" type="number" placeholder="0" /></div>
        <div class="field"><label>Typ</label><select id="track-type"><option>Utgift</option><option>Inkomst</option></select></div>
      </div>
    </div>

    <div id="modal-manual" style="display:none;">
      <div class="field"><label>Beskrivning</label><input id="m-desc" placeholder="t.ex. Brev till mamma" /></div>
      <div class="row2">
        <div class="field"><label>Avsändsdatum</label><input id="m-sent" type="date" /></div>
        <div class="field"><label>Beräknad leverans</label><input id="m-eta" type="date" /></div>
      </div>
      <div class="carrier-grid" id="carrier-grid-m" style="grid-template-columns:repeat(3,1fr);">
        <button class="carrier-chip sel" onclick="selectCarrierM(this,'PostNord')"><span class="dot" style="background:#D85A30"></span>PostNord</button>
        <button class="carrier-chip" onclick="selectCarrierM(this,'DHL')"><span class="dot" style="background:#EF9F27"></span>DHL</button>
        <button class="carrier-chip" onclick="selectCarrierM(this,'UPS')"><span class="dot" style="background:#633806"></span>UPS</button>
        <button class="carrier-chip" onclick="selectCarrierM(this,'FedEx')"><span class="dot" style="background:#185FA5"></span>FedEx</button>
        <button class="carrier-chip" onclick="selectCarrierM(this,'Budbee')"><span class="dot" style="background:#1D9E75"></span>Budbee</button>
        <button class="carrier-chip" onclick="selectCarrierM(this,'Instabox')"><span class="dot" style="background:#534AB7"></span>Instabox</button>
        <button class="carrier-chip" onclick="selectCarrierM(this,'Vinted')"><span class="dot" style="background:#09B1BA"></span>Vinted</button>
        <button class="carrier-chip" onclick="selectCarrierM(this,'Marketplace')"><span class="dot" style="background:#1877F2"></span>Marketplace</button>
        <button class="carrier-chip" onclick="selectCarrierM(this,'Tradera')"><span class="dot" style="background:#E8392A"></span>Tradera</button>
        <button class="carrier-chip" onclick="selectCarrierM(this,'Earlybird')"><span class="dot" style="background:#FF6B35"></span>Earlybird</button>
        <button class="carrier-chip" onclick="selectCarrierM(this,'Annat')" id="annat-chip-m" style="grid-column:span 3;flex-direction:row;justify-content:center;gap:8px;"><span class="dot" style="background:#888780"></span>Annat</button>
      </div>
      <div id="annat-wrap-m" style="display:none;" class="field">
        <label>Ange transportör / plattform</label>
        <input id="annat-name-m" placeholder="t.ex. Blocket, Wish, eget…" />
      </div>
      <div class="row2">
        <div class="field"><label>Avsändare</label><input id="m-from" placeholder="Ditt namn" /></div>
        <div class="field"><label>Mottagare</label><input id="m-to" placeholder="Mottagarens namn" /></div>
      </div>
      <div class="field"><label>Notering</label><textarea id="m-note" placeholder="Egna anteckningar…"></textarea></div>
      <div class="row2">
        <div class="field"><label>Kostnad (kr)</label><input id="m-cost" type="number" placeholder="0" /></div>
        <div class="field"><label>Typ</label><select id="m-type"><option>Utgift</option><option>Inkomst</option></select></div>
      </div>
    </div>

    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;" onclick="addShipment()">Lägg till försändelse</button>
  </div>
</div>

<script>
// ── DATA ──
const CARRIERS = {PostNord:'#D85A30',DHL:'#EF9F27',UPS:'#633806',FedEx:'#185FA5',Budbee:'#1D9E75',Instabox:'#534AB7',Vinted:'#09B1BA',Marketplace:'#1877F2',Tradera:'#E8392A',Earlybird:'#FF6B35',Annat:'#888780'};

let shipments = [
  {id:1,name:'Zalando – jacka',carrier:'PostNord',track:'SE1234567890SE',status:'transit',eta:'Idag 15:00',cost:220,costType:'Utgift',note:''},
  {id:2,name:'Amazon – hörlurar',carrier:'DHL',track:'1Z999AA10123456',status:'delivered',eta:'15 maj',cost:0,costType:'Utgift',note:''},
  {id:3,name:'Wish – elektronik',carrier:'UPS',track:'1Z888BB20456789',status:'customs',eta:'Okänt',cost:1340,costType:'Utgift',note:'Tullstop'},
  {id:4,name:'ASOS – jeans',carrier:'FedEx',track:'748947763620148',status:'pending',eta:'22 maj',cost:0,costType:'Utgift',note:''},
  {id:5,name:'Bokus – bok',carrier:'PostNord',track:'SE9876543210SE',status:'delivered',eta:'10 maj',cost:0,costType:'Utgift',note:''},
];

let invoices = [
  {id:1,name:'PostNord fraktkostnad',ref:'SE1234567890SE',amount:590,type:'out',due:'21 maj',paid:false},
  {id:2,name:'DHL expressavgift',ref:'1Z999AA10123456',amount:860,type:'out',due:'24 maj',paid:false},
  {id:3,name:'Kund AB – leverans',ref:'INV-2024-041',amount:2400,type:'in',due:'27 maj',paid:false},
  {id:4,name:'PostNord standardpaket',ref:'SE9876543210SE',amount:220,type:'out',due:'2 maj',paid:true},
  {id:5,name:'Privatkund – retur',ref:'INV-2024-038',amount:800,type:'in',due:'30 maj',paid:false},
];

let notifications = [
  {type:'green',icon:'✓',text:'Zalando-paket levererat till brevlådan',time:'Idag 09:14 · PostNord'},
  {type:'blue',icon:'🚚',text:'DHL-försändelse anlände till terminal i Göteborg',time:'Idag 07:30 · DHL'},
  {type:'red',icon:'!',text:'Faktura från PostNord förfaller om 3 dagar',time:'Igår 12:00'},
  {type:'amber',icon:'⏸',text:'Tullstop — komplettering kan behövas',time:'Igår 18:55 · UPS'},
  {type:'green',icon:'✓',text:'Betalning mottagen från Kund AB',time:'25 apr · 3 200 kr'},
  {type:'blue',icon:'🚚',text:'FedEx-paket avgick från Chicago',time:'28 apr · FedEx'},
];

let toggles = {delivery:true,customs:true,invoices:true,weekly:false};
let activeFilter = 'Alla';
let modalTab = 'track';
let selectedCarrierVal = 'PostNord';
let selectedCarrierMVal = 'PostNord';
let nextId = 6;
let currentView = 'dashboard';

// ── STATUS LABELS ──
const statusLabel = {transit:'Under transport',delivered:'Levererat',pending:'Väntar',customs:'Tull'};
const statusBadge = {transit:'b-transit',delivered:'b-delivered',pending:'b-pending',customs:'b-customs'};

// ── VIEWS ──
function showView(v) {
  currentView = v;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const items = document.querySelectorAll('.nav-item');
  const map = {dashboard:0,shipments:1,invoices:2,notifications:3,settings:4};
  if(items[map[v]]) items[map[v]].classList.add('active');
  const main = document.getElementById('main');
  main.innerHTML = '';

  if(v==='dashboard') renderDashboard(main);
  else if(v==='shipments') renderShipments(main);
  else if(v==='invoices') renderInvoices(main);
  else if(v==='notifications') renderNotifications(main);
  else if(v==='settings') renderSettings(main);
}

function topbar(title, btn='') {
  return `<div class="topbar"><div class="topbar-title">${title}</div>${btn}</div>`;
}

      <div class="metric"><div class="metric-label">Aktiva försändelser</div><div class="metric-val">${active}</div><div class="metric-sub">försändelser</div></div>

// ── SHIPMENTS ──
function renderShipments(el) {
  el.innerHTML = topbar('Försändelser', `<button class="btn btn-primary" onclick="openModal()">+ Lägg till</button>`);
  const c = document.createElement('div');
  c.className = 'content';

  const filters = ['Alla','Under transport','Levererat','Väntar','Tull'];
  const filtered = activeFilter==='Alla' ? shipments : shipments.filter(s=>statusLabel[s.status]===activeFilter);

  c.innerHTML = `
    <div class="search"><span style="color:var(--text-dim);font-size:15px;">🔍</span><input placeholder="Sök på spårningsnummer eller namn…" oninput="searchShipments(this.value)" id="search-input" /></div>
    <div class="filters">${filters.map(f=>`<button class="filter${activeFilter===f?' active':''}" onclick="filterBy('${f}')">${f}</button>`).join('')}</div>
    <div class="card" style="padding:0;overflow:hidden;">
      <table>
        <thead><tr><th style="padding:12px 12px 8px;">Försändelse</th><th>Transportör</th><th>Status</th><th>Leverans</th><th>Kostnad</th></tr></thead>
        <tbody id="ship-tbody">
          ${filtered.map(s=>`
          <tr>
            <td style="padding:12px;"><div class="td-main">${s.name}</div><div class="mono" style="font-size:11px;color:var(--text-darker);margin-top:2px;">${s.track}</div></td>
            <td><div style="display:flex;align-items:center;gap:7px;"><div class="dot" style="background:${CARRIERS[s.carrier]}"></div>${s.carrier}</div></td>
            <td><span class="badge ${statusBadge[s.status]}">${statusLabel[s.status]}</span></td>
            <td>${s.eta}</td>
            <td>${s.cost>0?s.cost.toLocaleString('sv')+' kr':'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  el.appendChild(c);
}

function filterBy(f) {
  activeFilter = f;
  showView('shipments');
}

function searchShipments(q) {
  const q2 = q.toLowerCase();
  const rows = shipments.filter(s=>s.name.toLowerCase().includes(q2)||s.track.toLowerCase().includes(q2));
  const tbody = document.getElementById('ship-tbody');
  if(tbody) tbody.innerHTML = rows.map(s=>`
    <tr>
      <td style="padding:12px;"><div class="td-main">${s.name}</div><div class="mono" style="font-size:11px;color:var(--text-darker);margin-top:2px;">${s.track}</div></td>
      <td><div style="display:flex;align-items:center;gap:7px;"><div class="dot" style="background:${CARRIERS[s.carrier]}"></div>${s.carrier}</div></td>
      <td><span class="badge ${statusBadge[s.status]}">${statusLabel[s.status]}</span></td>
      <td>${s.eta}</td>
      <td>${s.cost>0?s.cost.toLocaleString('sv')+' kr':'—'}</td>
    </tr>`).join('');
}

        <div class="inv-row">
          <div><div class="inv-name">${i.name}</div><div class="inv-meta">${i.ref}</div></div>
          <div style="text-align:right;"><div class="inv-amount amt-in">+${i.amount.toLocaleString('sv')} kr</div><div class="inv-due">Förfaller ${i.due}</div></div>

          <div style="display:flex;align-items:center;gap:8px;font-size:13px;"><div class="dot" style="background:${c}"></div>${n}</div>

function toggleSetting(k) {
  toggles[k] = !toggles[k];

}

// ── MODAL ──
function openModal() {
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}
function switchModalTab(t) {
  modalTab = t;
  document.getElementById('tab-track').classList.toggle('active', t==='track');
  document.getElementById('tab-manual').classList.toggle('active', t==='manual');
  document.getElementById('modal-track').style.display = t==='track'?'block':'none';
  document.getElementById('modal-manual').style.display = t==='manual'?'block':'none';
}

function selectCarrier(el, name) {
  document.querySelectorAll('#carrier-grid .carrier-chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  selectedCarrierVal = name;
  const w = document.getElementById('annat-wrap');
  if(w) w.style.display = name==='Annat' ? 'block' : 'none';
}
function selectCarrierM(el, name) {
  document.querySelectorAll('#carrier-grid-m .carrier-chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  selectedCarrierMVal = name;
  const w = document.getElementById('annat-wrap-m');
  if(w) w.style.display = name==='Annat' ? 'block' : 'none';
}

function onTrack(v) {
  const r = document.getElementById('recognized');
  const known = /^SE\d{8,}SE$/i.test(v) || /^1Z[A-Z0-9]{15,}/i.test(v) || /^\d{20}$/.test(v);
  r.style.display = known ? 'inline-block' : 'none';
  if(/^SE/i.test(v)) { document.querySelectorAll('#carrier-grid .carrier-chip')[0].click(); }
  else if(/^1Z/i.test(v)) { document.querySelectorAll('#carrier-grid .carrier-chip')[2].click(); }
}

function addShipment() {
  let s;
  if(modalTab==='track') {
    const track = document.getElementById('track-nr').value.trim();
    const name = document.getElementById('track-name').value.trim() || track;
    if(!track) { alert('Fyll i ett spårningsnummer.'); return; }
    let carrier = selectedCarrierVal;
    if(carrier==='Annat') {
      const custom = document.getElementById('annat-name').value.trim();
      if(!custom) { alert('Ange namn på transportör/plattform.'); return; }
      carrier = custom;
      if(!CARRIERS[carrier]) CARRIERS[carrier] = '#888780';
    }
    s = { id:nextId++, name: name||'Ny försändelse', carrier, track, status:'pending', eta:'Okänt', cost:parseFloat(document.getElementById('track-cost').value)||0, costType:document.getElementById('track-type').value, note:document.getElementById('track-note').value };
  } else {
    const desc = document.getElementById('m-desc').value.trim();
    if(!desc) { alert('Fyll i en beskrivning.'); return; }
    let carrier = selectedCarrierMVal;
    if(carrier==='Annat') {
      const custom = document.getElementById('annat-name-m').value.trim();
      if(!custom) { alert('Ange namn på transportör/plattform.'); return; }
      carrier = custom;
      if(!CARRIERS[carrier]) CARRIERS[carrier] = '#888780';
    }
    s = { id:nextId++, name:desc, carrier, track:'Manuell', status:'pending', eta:document.getElementById('m-eta').value||'Okänt', cost:parseFloat(document.getElementById('m-cost').value)||0, costType:document.getElementById('m-type').value, note:document.getElementById('m-note').value };
  }
  shipments.unshift(s);
  if(s.cost>0) {
    invoices.unshift({id:nextId++,name:`${s.carrier} – ${s.name}`,ref:s.track,amount:s.cost,type:s.costType==='Utgift'?'out':'in',due:'Okänt',paid:false});
  }
  notifications.unshift({type:'blue',icon:'📦',text:`${s.name} tillagd`,time:'Precis nu'});
  closeModal();
  showView(currentView);
}

// Stäng modal vid klick utanför
document.getElementById('modal').addEventListener('click', function(e){
  if(e.target===this) closeModal();
});

// Boot
showView('dashboard');
</script>

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()" title="Byt tema">🌙</button>
<script>
function toggleTheme() {
  var body = document.body;
  var btn = document.getElementById('theme-btn');
  if(body.classList.contains('light')) {
    body.classList.remove('light');
    btn.textContent = '🌙';
    localStorage.setItem('pk-theme', 'dark');
  } else {
    body.classList.add('light');
    btn.textContent = '☀️';
    localStorage.setItem('pk-theme', 'light');
  }
}
// Återställ valt tema
if(localStorage.getItem('pk-theme') === 'light') {
  document.body.classList.add('light');
  document.getElementById('theme-btn') && (document.getElementById('theme-btn').textContent = '☀️');
}
</script>

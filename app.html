async function updateShipment(id) {
  const name     = document.getElementById('sd-name').value.trim();
  const track    = document.getElementById('sd-track').value.trim();
  const carrier  = document.getElementById('sd-carrier').value;
  const status   = document.getElementById('sd-status').value;
  const eta      = document.getElementById('sd-eta').value.trim();
  const cost     = parseFloat(document.getElementById('sd-cost').value) || 0;
  const costType = document.getElementById('sd-costtype').value;
  const note     = document.getElementById('sd-note').value.trim();
  const { error } = await _supa.from('shipments').update({
    name, track, carrier, status, eta, cost, cost_type: costType, note
  }).eq('id', id);
  if(error) { alert('Kunde inte spara: ' + error.message); return; }
  const s = shipments.find(x => x.id == id);
  if(s) { s.name=name; s.track=track; s.carrier=carrier; s.status=status; s.eta=eta; s.cost=cost; s.costType=costType; s.note=note; }
  document.getElementById('shipment-detail-modal').style.display = 'none';
  showView('shipments');
}

function renderInvoices(el) {
  const skalBetala  = invoices.filter(i=>!i.paid&&i.type==='out');
  const skalFaBetalt = invoices.filter(i=>!i.paid&&i.type==='in');
  const harBetalat  = invoices.filter(i=>i.paid&&i.type==='out');
  const harFattBetalt = invoices.filter(i=>i.paid&&i.type==='in');

  const totalSkalBetala = skalBetala.reduce((a,i)=>a+i.amount,0);
  const totalSkalFa     = skalFaBetalt.reduce((a,i)=>a+i.amount,0);
  const totalHarBetalat = harBetalat.reduce((a,i)=>a+i.amount,0);
  const totalHarFatt    = harFattBetalt.reduce((a,i)=>a+i.amount,0);

  // Budgetgräns från localStorage
  const budgetLimit = parseFloat(localStorage.getItem('pk-budget-limit')) || 0;
  const overBudget  = budgetLimit > 0 && totalSkalBetala > budgetLimit;
  const nearBudget  = budgetLimit > 0 && !overBudget && totalSkalBetala > budgetLimit * 0.8;

  el.innerHTML = topbar('🧾 Kostnader', '<button class="btn btn-primary" onclick="openInvoiceModal()">+ Lägg till</button>');
  const c = document.createElement('div');
  c.className = 'content';

  function invRow(i) {
    const isOut = i.type === 'out';
    return '<div class="inv-row">'
      + '<div style="flex:1;">'
      + '<div class="inv-name">' + i.name + '</div>'
      + (i.ref ? '<div class="inv-meta">' + i.ref + '</div>' : '')
      + (i.due ? '<div class="inv-due">' + (i.paid ? 'Klar' : 'Datum: ' + i.due) + '</div>' : '')
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:8px;">'
      + '<div class="inv-amount ' + (isOut?'amt-out':'amt-in') + '">' + (isOut?'−':'+') + i.amount.toLocaleString('sv') + ' kr</div>'
      + (!i.paid ? '<button onclick="markInvoicePaid(\'' + i.id + '\')" style="background:rgba(29,158,117,0.15);border:0.5px solid var(--teal);color:var(--teal-light);border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;font-family:inherit;">✓ Klar</button>' : '')
      + '<button onclick="deleteInvoice(\'' + i.id + '\')" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;">🗑️</button>'
      + '</div>'
      + '</div>';
  }

  // Barometer-indikator
  const barometerStyle = overBudget
    ? 'display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#F09595;animation:pulse 1.2s ease-in-out infinite;'
    : nearBudget
    ? 'display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#FAC775;animation:pulse 1.8s ease-in-out infinite;'
    : 'display:none;';
  const barometerText = overBudget ? '⚠️ Köpgräns överskriden!' : '⚠️ Nära köpgränsen';

  c.innerHTML = '<style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}</style>'
    + '<div class="metrics" style="grid-template-columns:repeat(2,1fr);margin-bottom:1.25rem;">'
    + '<div class="metric" onclick="document.getElementById(\'inv-s1\').scrollIntoView({behavior:\'smooth\'})" style="cursor:pointer;"><div class="metric-label">Jag ska betala</div><div class="metric-val" style="color:#F09595;">' + totalSkalBetala.toLocaleString('sv') + ' kr</div></div>'
    + '<div class="metric" onclick="document.getElementById(\'inv-s2\').scrollIntoView({behavior:\'smooth\'})" style="cursor:pointer;"><div class="metric-label">Jag ska få betalt</div><div class="metric-val" style="color:var(--teal-light);">' + totalSkalFa.toLocaleString('sv') + ' kr</div></div>'
    + '<div class="metric" onclick="document.getElementById(\'inv-s3\').scrollIntoView({behavior:\'smooth\'})" style="cursor:pointer;"><div class="metric-label">Jag har betalat</div><div class="metric-val">' + totalHarBetalat.toLocaleString('sv') + ' kr</div></div>'
    + '<div class="metric" onclick="document.getElementById(\'inv-s4\').scrollIntoView({behavior:\'smooth\'})" style="cursor:pointer;"><div class="metric-label">Jag har fått betalt</div><div class="metric-val" style="color:var(--teal-light);">' + totalHarFatt.toLocaleString('sv') + ' kr</div></div>'
    + '</div>'

    + '<div class="card" id="inv-s1" style="margin-bottom:1rem;">'
    + '<div class="card-header"><span class="card-title" style="font-size:15px;font-weight:600;">💸 Jag ska betala</span><span style="' + barometerStyle + '">' + barometerText + '</span></div>'
    + (skalBetala.length === 0 ? '<div style="font-size:13px;color:var(--text-dim);text-align:center;padding:0.75rem 0;">Inga utgifter</div>' : skalBetala.map(invRow).join(''))
    + '</div>'

    + '<div class="card" id="inv-s2" style="margin-bottom:1rem;">'
    + '<div class="card-header"><span class="card-title" style="font-size:15px;font-weight:600;">💰 Jag ska få betalt</span></div>'
    + (skalFaBetalt.length === 0 ? '<div style="font-size:13px;color:var(--text-dim);text-align:center;padding:0.75rem 0;">Inga väntande inkomster</div>' : skalFaBetalt.map(invRow).join(''))
    + '</div>'

    + '<div class="card" id="inv-s3" style="margin-bottom:1rem;">'
    + '<div class="card-header"><span class="card-title" style="font-size:15px;font-weight:600;">✅ Jag har betalat</span></div>'
    + (harBetalat.length === 0 ? '<div style="font-size:13px;color:var(--text-dim);text-align:center;padding:0.75rem 0;">Inget här ännu</div>' : harBetalat.map(invRow).join(''))
    + '</div>'

    + '<div class="card" id="inv-s4">'
    + '<div class="card-header"><span class="card-title" style="font-size:15px;font-weight:600;">🎉 Jag har fått betalt</span></div>'
    + (harFattBetalt.length === 0 ? '<div style="font-size:13px;color:var(--text-dim);text-align:center;padding:0.75rem 0;">Inget här ännu</div>' : harFattBetalt.map(invRow).join(''))
    + '</div>';

  el.appendChild(c);
}

async function saveAccountSettings() {
  const name  = document.getElementById('set-name').value.trim();
  const phone = document.getElementById('set-phone').value.trim();
  const { error } = await _supa.auth.updateUser({
    data: { name, phone }
  });
  const msg = document.getElementById('set-saved');
  if(!error && msg) {
    msg.style.display = 'block';
    // Uppdatera sidebar-namnet
    const nameEl = document.querySelector('.sidebar-bottom .nav-item:last-child span');
    if(nameEl) nameEl.textContent = name.split(' ')[0];
    const avatarEl = document.querySelector('.avatar');
    if(avatarEl) avatarEl.textContent = name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
    setTimeout(() => { msg.style.display = 'none'; }, 2000);
  }
}

async function saveNewPassword() {
  const pw1 = document.getElementById('set-pw1').value;
  const pw2 = document.getElementById('set-pw2').value;
  const msg = document.getElementById('set-pw-msg');
  if(pw1.length < 6) { msg.textContent = 'Minst 6 tecken!'; msg.style.color='#F09595'; msg.style.display='block'; return; }
  if(pw1 !== pw2) { msg.textContent = 'Lösenorden matchar inte!'; msg.style.color='#F09595'; msg.style.display='block'; return; }
  const { error } = await _supa.auth.updateUser({ password: pw1 });
  if(error) { msg.textContent = 'Fel: ' + error.message; msg.style.color='#F09595'; }
  else { msg.textContent = '✓ Lösenord bytt!'; msg.style.color='var(--teal-light)'; document.getElementById('set-pw1').value=''; document.getElementById('set-pw2').value=''; }
  msg.style.display = 'block';
  setTimeout(() => { msg.style.display='none'; }, 3000);
}

async function confirmDeleteAccount() {
  if(!confirm('Är du säker? All din data raderas permanent!')) return;
  if(!confirm('Sista chansen — detta går INTE att ångra!')) return;
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  // Radera all användardata
  const uid = session.user.id;
  await Promise.all([
    _supa.from('shipments').delete().eq('user_id', uid),
    _supa.from('presents').delete().eq('user_id', uid),
    _supa.from('wishlists').delete().eq('user_id', uid),
    _supa.from('invoices').delete().eq('user_id', uid),
    _supa.from('house_windows').delete().eq('user_id', uid),
    _supa.from('archive').delete().eq('user_id', uid),
    _supa.from('treasure').delete().eq('user_id', uid),
  ]);
  await _supa.auth.signOut();
  window.location.href = 'index.html';
}

// ── MODAL ──
function openModal() {
  // Nollställ alla fält
  ['track-nr','track-name','track-note','track-cost','m-desc','m-from','m-to','m-note','m-cost','annat-name','annat-name-m'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.value = '';
  });
  const rec = document.getElementById('recognized');
  if(rec) rec.style.display = 'none';
  // Återställ till spårningsnummer-tab
  switchModalTab('track');
  // Återställ transportörval
  const chips = document.querySelectorAll('#carrier-grid .carrier-chip');
  chips.forEach(c => c.classList.remove('sel'));
  if(chips[0]) chips[0].classList.add('sel');
  selectedCarrierVal = 'PostNord';
  const annatWrap = document.getElementById('annat-wrap');
  if(annatWrap) annatWrap.style.display = 'none';
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function switchModalTab(t) {
  modalTab = t;
  document.getElementById('tab-track').classList.toggle('active', t==='track');
  document.getElementById('tab-manual').classList.toggle('active', t==='manual');
  document.getElementById('modal-track').style.display = t==='track'?'block':'none';
  document.getElementById('modal-manual').style.display = t==='manual'?'block':'none';
}

function selectCarrier(el, name) {
  document.querySelectorAll('#carrier-grid .carrier-chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel'); selectedCarrierVal = name;
  var w = document.getElementById('annat-wrap');
  if(w) w.style.display = name==='Annat' ? 'block' : 'none';
}
function selectCarrierM(el, name) {
  document.querySelectorAll('#carrier-grid-m .carrier-chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel'); selectedCarrierMVal = name;
  var w = document.getElementById('annat-wrap-m');
  if(w) w.style.display = name==='Annat' ? 'block' : 'none';
}

function onTrack(v) {
  const r = document.getElementById('recognized');
  const known = /^SE\d{8,}SE$/i.test(v) || /^1Z[A-Z0-9]{15,}/i.test(v) || /^\d{20}$/.test(v);
  r.style.display = known ? 'inline-block' : 'none';
  if(/^SE/i.test(v)) { document.querySelectorAll('#carrier-grid .carrier-chip')[0].click(); }
  else if(/^1Z/i.test(v)) { document.querySelectorAll('#carrier-grid .carrier-chip')[2].click(); }
}

    costType = document.getElementById('track-type').value;
    note = document.getElementById('track-note').value;
  } else {
    name = document.getElementById('m-desc').value.trim();

      carrier = custom;
      if(!CARRIERS[carrier]) CARRIERS[carrier] = '#888780';
    }
    track = 'Manuell';
    eta = document.getElementById('m-eta').value || 'Okänt';
    cost = parseFloat(document.getElementById('m-cost').value)||0;
    costType = document.getElementById('m-type').value;
    note = document.getElementById('m-note').value;
  }
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) { alert('Du måste vara inloggad.'); return; }
  const { data, error } = await _supa.from('shipments').insert([{
    user_id: session.user.id, name, carrier, track, status, eta,

function openInvoiceModal() {
  var existing = document.getElementById('invoice-modal');
  if(existing) {
    existing.style.display='flex';
    ['inv-amount','inv-ref'].forEach(id => { var el=document.getElementById(id); if(el) el.value=''; });
    // Sätt dagens datum
    var dateEl = document.getElementById('inv-due');
    if(dateEl) dateEl.value = new Date().toISOString().split('T')[0];
    return;
  }
  var modal = document.createElement('div');
  modal.id = 'invoice-modal';
  modal.className = 'modal-bg';
  modal.style.display = 'flex';

  // Bygg butikslista från SHOPS + LOGISTICS
  const allShops = [...LOGISTICS.map(x=>x.name), ...SHOPS.filter(x=>x.name!=='Valfritt').map(x=>x.name)];
  const shopOptions = allShops.map(function(n) { return '<option value="' + n + '">' + n + '</option>'; }).join('');
  const today = new Date().toISOString().split('T')[0];

  modal.innerHTML = '<div class="modal">'
    + '<div class="modal-title">🧾 Lägg till kostnad'
    + '<button class="close-btn" onclick="document.getElementById(\'invoice-modal\').style.display=\'none\'">✕</button></div>'
    + '<p style="font-size:12px;color:var(--text-muted);margin-bottom:1rem;">Tre enkla fält — klart på 10 sekunder!</p>'
    + '<div class="field"><label>Butik eller avsändare</label>'
    + '<select id="inv-name" style="width:100%;background:var(--bg3);border:0.5px solid rgba(255,255,255,0.1);border-radius:7px;padding:9px 12px;font-size:13px;color:var(--text);font-family:inherit;outline:none;" onchange="toggleInvCustom(this.value)">'
    + shopOptions + '<option value="__annan__">Annan…</option></select></div>'
    + '<div class="field" id="inv-custom-wrap" style="display:none;"><label>Ange namn</label><input id="inv-custom" placeholder="t.ex. Klarna, Nets…" /></div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">'
    + '<div class="field"><label>Belopp (kr)</label><input id="inv-amount" type="number" placeholder="0" autofocus /></div>'
    + '<div class="field"><label>Datum</label><input id="inv-due" type="date" value="' + today + '" /></div>'
    + '</div>'
    + '<div class="field"><label>Typ</label>'
    + '<select id="inv-type" style="width:100%;background:var(--bg3);border:0.5px solid rgba(255,255,255,0.1);border-radius:7px;padding:9px 12px;font-size:13px;color:var(--text);font-family:inherit;outline:none;">'
    + '<option value="out">💸 Utgift — att betala</option>'
    + '<option value="in">💰 Inkomst — väntande betalning</option>'
    + '</select></div>'
    + '<div class="field" id="inv-ref-wrap"><label>Referens (valfritt)</label><input id="inv-ref" placeholder="t.ex. ordernummer, fakturanummer" /></div>'
    + '<button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;" onclick="saveInvoice()">Spara</button>'
    + '</div>';
  modal.addEventListener('click', function(e){ if(e.target===this) this.style.display='none'; });
  document.body.appendChild(modal);
}

function toggleInvCustom(val) {
  var wrap = document.getElementById('inv-custom-wrap');
  if(wrap) wrap.style.display = val === '__annan__' ? 'block' : 'none';
}

async function saveInvoice() {
  let name = document.getElementById('inv-name').value;
  if(name === '__annan__') {
    name = document.getElementById('inv-custom').value.trim();
    if(!name) { alert('Fyll i ett namn.'); return; }
  }
  const amount = parseFloat(document.getElementById('inv-amount').value) || 0;
  if(!amount) { alert('Fyll i ett belopp.'); return; }
  const ref  = document.getElementById('inv-ref').value.trim();
  const due  = document.getElementById('inv-due').value || new Date().toISOString().split('T')[0];
  const type = document.getElementById('inv-type').value;
  await addInvoice(name, ref, amount, type, due);
  document.getElementById('invoice-modal').style.display = 'none';
  notifications.unshift({t:'amber',i:'🧾',text:name+' tillagd',time:'Precis nu'});
  showView('invoices');
}

async function loadInvoices() {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const { data, error } = await _supa.from('invoices').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false });
  if(!error && data) {
    invoices = data.map(i => ({ id:i.id, name:i.name, ref:i.ref||'', amount:i.amount||0, type:i.type||'out', due:i.due||'', paid:i.paid||false }));
    if(currentView === 'invoices') showView('invoices');
    else showView('dashboard');
  }
}

async function addInvoice(name, ref, amount, type, due) {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const { data, error } = await _supa.from('invoices').insert([{
    user_id: session.user.id, name, ref, amount, type, due, paid: false
  }]).select();
  if(!error && data) invoices.unshift({ id:data[0].id, name, ref, amount, type, due, paid:false });
}

async function loadPresents() {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const { data, error } = await _supa.from('presents').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false });
  if(!error && data) { presents = data; if(currentView === 'presents') showView('presents'); }
}

async function loadShipments() {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const { data, error } = await _supa.from('shipments').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false });
  if(!error && data) {
    shipments = data.map(s => ({ id:s.id, name:s.name, carrier:s.carrier, track:s.track, status:s.status||'pending', eta:s.eta||'Okänt', cost:s.cost||0, costType:s.cost_type||'Utgift', note:s.note||'', rating:s.rating||null, rating_note:s.rating_note||'', direction:s.direction||'in' }));
    // Rita om aktuell vy med ny data
    var main = document.getElementById('main');
    if(currentView === 'dashboard') renderDashboard(main);
    else if(currentView === 'myhouse') renderMyHouse(main);
    else if(currentView === 'shipments') renderShipments(main);
    else if(currentView === 'statistics') renderStatistics(main);
  }
}

document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
</script>

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()" title="Byt tema">🌙</button>
<script>
function toggleTheme() {
  var body = document.body;
  var btn = document.getElementById('theme-btn');
  if(body.classList.contains('light')) {
    body.classList.remove('light'); btn.textContent = '🌙';
    localStorage.setItem('pk-theme', 'dark');
  } else {
    body.classList.add('light'); btn.textContent = '☀️';
    localStorage.setItem('pk-theme', 'light');
  }
}
if(localStorage.getItem('pk-theme') === 'light') {
  document.body.classList.add('light');
  var tb = document.getElementById('theme-btn');
  if(tb) tb.textContent = '☀️';
}
</script>

<!DOCTYPE html>
<!-- Postillien v2.1 -->
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Postillien — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1E1A3A; --bg2: #272050; --bg3: #26215C;
      --purple: #534AB7; --purple-light: #7F77DD; --purple-pale: #AFA9EC; --purple-muted: #3C3489;
      --teal: #1D9E75; --teal-light: #9FE1CB;
      --text: #FFFFFF; --text-muted: #888780; --text-dim: #5F5E5A; --text-darker: #444441;
      --border: rgba(255,255,255,0.07);
      --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; height: 100vh; display: flex; overflow: hidden; }

    /* SIDEBAR */
    .sidebar { width: 220px; background: var(--bg2); border-right: 0.5px solid var(--border); display: flex; flex-direction: column; padding: 1.25rem 0.75rem; flex-shrink: 0; }
    .sidebar-logo { display: flex; align-items: center; gap: 9px; padding: 0 0.5rem 1.25rem; border-bottom: 0.5px solid var(--border); margin-bottom: 0.75rem; }
    .logo-text { font-size: 16px; font-weight: 500; color: #fff; letter-spacing: -0.3px; }
    .logo-text span { color: var(--purple-pale); }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--text-muted); cursor: pointer; transition: all 0.12s; font-size: 13px; margin-bottom: 2px; }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav-item.active { background: var(--bg3); color: var(--purple-pale); font-weight: 500; }
    .nav-item i { font-size: 16px; }
    .sidebar-bottom { margin-top: auto; border-top: 0.5px solid var(--border); padding-top: 0.75rem; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: var(--purple-pale); flex-shrink: 0; }

    /* MAIN */
    .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 0.5px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 10; }
    .topbar-title { font-size: 16px; font-weight: 500; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 7px; font-size: 13px; font-family: var(--font); cursor: pointer; transition: all 0.12s; border: none; }
    .btn-primary { background: var(--purple); color: #fff; }
    .btn-primary:hover { background: var(--purple-muted); }
    .btn-ghost { background: transparent; border: 0.5px solid var(--border); color: var(--text-muted); }
    .btn-ghost:hover { background: var(--bg2); color: var(--text); }
    .content { padding: 1.5rem; flex: 1; }

    /* METRICS */
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.25rem; }
    .metric { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; }
    .metric-label { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
    .metric-val { font-size: 22px; font-weight: 500; }
    .metric-sub { font-size: 11px; color: var(--text-darker); margin-top: 3px; }

    /* CARDS */
    .card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .card-title { font-size: 13px; font-weight: 500; color: var(--text); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* TABLE */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 11px; font-weight: 500; color: var(--text-dim); padding: 0 8px 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 10px 8px; border-top: 0.5px solid var(--border); color: var(--text-muted); vertical-align: middle; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .td-main { color: var(--text); }

    /* BADGES */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; white-space: nowrap; }
    .b-transit { background: rgba(55,138,221,0.15); color: #85B7EB; }
    .b-delivered { background: rgba(29,158,117,0.15); color: var(--teal-light); }
    .b-pending { background: rgba(186,117,23,0.15); color: #FAC775; }
    .b-customs { background: rgba(216,90,48,0.15); color: #F0997B; }

    /* DOT */
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    /* SEARCH */
    .search { display: flex; align-items: center; gap: 8px; background: var(--bg3); border: 0.5px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 1rem; }
    .search input { background: transparent; border: none; outline: none; font-size: 13px; color: var(--text); font-family: var(--font); flex: 1; }
    .search input::placeholder { color: var(--text-darker); }

    /* FILTERS */
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
    .filter { padding: 5px 12px; border-radius: 99px; font-size: 12px; border: 0.5px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font-family: var(--font); transition: all 0.12s; }
    .filter.active { background: var(--bg3); color: var(--purple-pale); border-color: var(--purple-light); }

    /* NOTIF */
    .notif { display: flex; gap: 10px; padding: 10px 0; border-top: 0.5px solid var(--border); align-items: flex-start; }
    .notif:first-child { border-top: none; }
    .notif-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .ni-green { background: rgba(29,158,117,0.15); }
    .ni-blue { background: rgba(55,138,221,0.15); }
    .ni-amber { background: rgba(186,117,23,0.15); }
    .ni-red { background: rgba(226,75,74,0.15); }
    .notif-body { font-size: 13px; color: var(--text); line-height: 1.5; }
    .notif-time { font-size: 11px; color: var(--text-darker); margin-top: 2px; }

    /* INVOICE */
    .inv-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-top: 0.5px solid var(--border); }
    .inv-row:first-child { border-top: none; }
    .inv-name { font-size: 13px; color: var(--text); }
    .inv-meta { font-size: 11px; color: var(--text-darker); margin-top: 2px; }
    .inv-amount { font-size: 14px; font-weight: 500; }
    .amt-out { color: #F09595; }
    .amt-in { color: var(--teal-light); }
    .inv-due { font-size: 11px; color: var(--text-darker); text-align: right; margin-top: 2px; }

    /* FORM */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 14px; padding: 1.5rem; width: 460px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 16px; font-weight: 500; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; }
    .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; line-height: 1; }
    .tabs { display: flex; gap: 4px; background: var(--bg3); border-radius: 8px; padding: 4px; margin-bottom: 1.25rem; }
    .tab { flex: 1; padding: 7px; text-align: center; font-size: 12px; color: var(--text-dim); border-radius: 6px; cursor: pointer; font-family: var(--font); border: none; background: transparent; transition: all 0.12s; }
    .tab.active { background: var(--bg2); color: var(--purple-pale); font-weight: 500; }
    .field { margin-bottom: 12px; }
    .field label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px; }
    .field input, .field select, .field textarea { width: 100%; background: var(--bg3); border: 0.5px solid rgba(255,255,255,0.1); border-radius: 7px; padding: 9px 12px; font-size: 13px; color: var(--text); font-family: var(--font); outline: none; transition: border-color 0.12s; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--purple-light); }
    .field input::placeholder, .field textarea::placeholder { color: var(--text-darker); }
    .field select option { background: var(--bg2); }
    .field textarea { min-height: 60px; resize: none; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .carrier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .carrier-chip { border: 0.5px solid var(--border); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; font-size: 11px; color: var(--text-muted); font-family: var(--font); background: transparent; transition: all 0.12s; }
    .carrier-chip.sel { border-color: var(--purple-light); background: var(--bg3); color: var(--purple-pale); }
    .mono { font-family: var(--mono); }
    .recognized { display: inline-block; font-size: 10px; background: rgba(29,158,117,0.2); color: var(--teal-light); padding: 2px 7px; border-radius: 99px; margin-left: 8px; }

    /* SETTINGS */
    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 0.5px solid var(--border); }
    .setting-row:first-child { border-top: none; }
    .toggle { width: 36px; height: 20px; border-radius: 99px; cursor: pointer; position: relative; transition: background 0.2s; border: none; flex-shrink: 0; }
    .toggle.on { background: var(--purple); }
    .toggle.off { background: var(--bg3); }
    .toggle::after { content:''; position: absolute; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: white; transition: left 0.2s; }
    .toggle.on::after { left: 18px; }
    .toggle.off::after { left: 2px; }

    /* LJUST LÄGE — vit bakgrund, grå detaljer, svart text */
    body.monochrome {
      --bg: #FFFFFF; --bg2: #F4F4F4; --bg3: #E8E8E8;
      --text: #111111; --text-muted: #555555; --text-dim: #888888; --text-darker: #AAAAAA;
      --border: rgba(0,0,0,0.1);
      --purple: #444444; --purple-light: #666666; --purple-pale: #555555; --purple-muted: #333333;
      --teal: #333333; --teal-light: #555555;
    }
    body.monochrome #house-svg { filter: grayscale(1) brightness(1.3) contrast(0.85); background: #F4F4F4; }
    body.monochrome #house-svg .sky-bg { fill: #F4F4F4; }
    body.monochrome .theme-toggle { background: #E8E8E8; }

    /* Tema-knapp */
    .theme-toggle { position: fixed; bottom: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: var(--bg2); border: 0.5px solid var(--border); font-size: 18px; cursor: pointer; z-index: 50; display: flex; align-items: center; justify-content: center; }

    /* LIGHT THEME */
    body.light { --bg: #F5F4FF; --bg2: #FFFFFF; --bg3: #EEEDF8; --text: #1E1A3A; --text-muted: #6B6880; --text-dim: #9895A8; --text-darker: #B5B3C0; --border: rgba(0,0,0,0.08); }

    /* ── MOBILANPASSNING ── */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      body { flex-direction: column; }
      .app { flex-direction: column; height: 100vh; }
      .main { flex: 1; overflow-y: auto; padding-bottom: 70px; }
      .bottom-nav {
        display: flex !important;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: var(--bg2);
        border-top: 0.5px solid var(--border);
        z-index: 100; height: 60px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .bottom-nav::-webkit-scrollbar { display: none; }
      .bottom-nav-item {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 2px; cursor: pointer; font-size: 10px;
        color: var(--text-muted); padding: 6px 2px;
        border: none; background: transparent;
        font-family: var(--font); transition: color 0.12s;
        min-width: 52px;
      }
      .bottom-nav-item.active { color: var(--purple-pale); }
      .bottom-nav-item span { font-size: 20px; }
      /* Huset — logistik/köpställe-korten: 2 kolumner */
      .logistics-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .shops-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .metrics { grid-template-columns: 1fr 1fr !important; }
      .two-col { grid-template-columns: 1fr !important; }
      .topbar { padding: 0.75rem 1rem; }
      .topbar-title { font-size: 15px; }
      .content { padding: 0.75rem; }
      .modal { width: 95vw; padding: 1.25rem; }
      table th:nth-child(4), table td:nth-child(4),
      table th:nth-child(5), table td:nth-child(5),
      table th:nth-child(6), table td:nth-child(6) { display: none; }
      .theme-toggle { bottom: 70px; right: 12px; }
    }
    @media (min-width: 769px) {
      .bottom-nav { display: none; }
    }
    .home-btn { display: none; }
    @media (max-width: 768px) {
      .home-btn { display: inline-flex !important; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 8px; background: var(--bg3); border: none; color: var(--purple-pale); font-size: 18px; cursor: pointer; flex-shrink: 0; }
    }

    /* iPhone mini (375px) extra kompakt */
    @media (max-width: 390px) {
      .content { padding: 0.6rem; }
      .topbar { padding: 0.6rem 0.75rem; }
      .topbar-title { font-size: 14px; }
      .btn { padding: 6px 10px; font-size: 12px; }
      .card { padding: 0.9rem; }
      .metric { padding: 0.75rem; }
      .metric-val { font-size: 18px; }
      .metric-label { font-size: 10px; }
      .bottom-nav-item { font-size: 9px; min-width: 48px; }
      .bottom-nav-item span { font-size: 18px; }
      .modal { padding: 1rem; }
      .field input, .field select, .field textarea { padding: 8px 10px; font-size: 12px; }
    }

    @media (max-width: 768px) {
      /* Dölj snabbknappar på mobil — finns redan i bottom-nav */
      .dashboard-shortcuts { display: none !important; }
      .dashboard-reminders { grid-template-columns: repeat(3, 1fr) !important; }
      /* SVG-huset — begränsa höjden så det inte flödar */
      #house-svg { max-height: 55vw; width: 100%; }
    }

    /* HUSET — sektionsetiketter */
    .house-section-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 500;
    }
    .badge-attic { background: rgba(83,74,183,0.2); color: var(--purple-pale); border: 0.5px solid var(--purple-muted); }
    .badge-windows { background: rgba(29,158,117,0.15); color: var(--teal-light); border: 0.5px solid rgba(29,158,117,0.3); }
  </style>

</head>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-logo">
    <svg width="42" height="42" viewBox="0 0 52 52" fill="none"><polygon points="26,4 48,16 48,38 26,50 4,38 4,16" fill="#3C3489"/><polygon points="26,4 48,16 26,28 4,16" fill="#534AB7"/><polygon points="48,16 48,38 26,50 26,28" fill="#26215C"/><polygon points="4,16 26,28 26,50 4,38" fill="#2D2570"/><rect x="13" y="18" width="22" height="15" rx="2" fill="#FFCD00"/><path d="M13 20L24 27L35 20" stroke="#B8920A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="33" cy="31" r="5.5" fill="#1D9E75"/><path d="M30.2 31l2 2 3.2-3.2" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>

<!-- MAIN -->
<div class="main" id="main"></div>

<!-- MODAL: Lägg till försändelse -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-title">
      Lägg till försändelse
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-track" onclick="switchModalTab('track')">Spårningsnummer</button>
      <button class="tab" id="tab-manual" onclick="switchModalTab('manual')">Manuell</button>
    </div>

    <div id="modal-track">
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">Transportör / plattform</div>
      <div class="carrier-grid" id="carrier-grid" style="grid-template-columns:repeat(3,1fr);">
        <button class="carrier-chip sel" onclick="selectCarrier(this,'PostNord')"><span class="dot" style="background:#D85A30"></span>PostNord</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'DHL')"><span class="dot" style="background:#EF9F27"></span>DHL</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'UPS')"><span class="dot" style="background:#633806"></span>UPS</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'FedEx')"><span class="dot" style="background:#185FA5"></span>FedEx</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'Budbee')"><span class="dot" style="background:#1D9E75"></span>Budbee</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'Instabox')"><span class="dot" style="background:#534AB7"></span>Instabox</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'Vinted')"><span class="dot" style="background:#09B1BA"></span>Vinted</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'Marketplace')"><span class="dot" style="background:#1877F2"></span>Marketplace</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'Tradera')"><span class="dot" style="background:#E8392A"></span>Tradera</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'Earlybird')"><span class="dot" style="background:#FF6B35"></span>Earlybird</button>
        <button class="carrier-chip" onclick="selectCarrier(this,'Annat')" id="annat-chip" style="grid-column:span 3;flex-direction:row;justify-content:center;gap:8px;"><span class="dot" style="background:#888780"></span>Annat</button>
      </div>
      <div id="annat-wrap" style="display:none;" class="field">
        <label>Ange transportör / plattform</label>
        <input id="annat-name" placeholder="t.ex. Blocket, Wish, eget…" />
      </div>
      <div class="field">
        <label>Spårningsnummer <span id="recognized" class="recognized" style="display:none;">Igenkänd ✓</span></label>
        <input id="track-nr" class="mono" placeholder="t.ex. SE123456789SE" oninput="onTrack(this.value)" />
      </div>
      <div class="field">
        <label>Smeknamn (valfritt)</label>
        <input id="track-name" placeholder="t.ex. Jacka från ASOS" />
      </div>
      <div class="field">
        <label>Notering</label>
        <textarea id="track-note" placeholder="Egna anteckningar…"></textarea>
      </div>
      <div class="row2">
        <div class="field"><label>Kostnad (kr)</label><input id="track-cost" type="number" placeholder="0" /></div>
        <div class="field"><label>Typ</label><select id="track-type"><option>Utgift</option><option>Inkomst</option></select></div>
      </div>
    </div>

    <div id="modal-manual" style="display:none;">
      <div class="field"><label>Beskrivning</label><input id="m-desc" placeholder="t.ex. Brev till mamma" /></div>
      <div class="row2">
        <div class="field"><label>Avsändsdatum</label><input id="m-sent" type="date" /></div>
        <div class="field"><label>Beräknad leverans</label><input id="m-eta" type="date" /></div>
      </div>
      <div class="carrier-grid" id="carrier-grid-m" style="grid-template-columns:repeat(3,1fr);">

// ── KÄLLARLÅS ──
var cellarUnlocked = false;

async function checkCellarLock() {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const { data } = await _supa.from('house_windows').select('windows').eq('user_id', session.user.id).single();
  if(data && data.windows && data.windows.includes('__cellar_unlocked__')) {
    cellarUnlocked = true;
    return;
  }
  // Kolla om användaren har minst 1 transaktion
  const { data: shipData } = await _supa.from('shipments').select('id').eq('user_id', session.user.id).limit(1);
  const { data: invData }  = await _supa.from('invoices').select('id').eq('user_id', session.user.id).limit(1);
  const hasTransaction = (shipData && shipData.length > 0) || (invData && invData.length > 0);
  if(hasTransaction) {
    await unlockCellarSilent();
  }
}

async function unlockCellarSilent() {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const current = myWindows.filter(w => w !== '__cellar_unlocked__');
  current.push('__cellar_unlocked__');
  await _supa.from('house_windows').upsert({
    user_id: session.user.id,
    windows: current,
    updated_at: new Date().toISOString()
  });
  cellarUnlocked = true;
}

async function unlockCellar() {
  await unlockCellarSilent();
  var modal = document.getElementById('cellar-modal');
  if(modal) modal.style.display = 'none';
  openCellarContent();
}

        <a href="https://wa.me/?text=Hej%2C%20nu%20har%20jag%20hittat%20en%20ny%20smart%20app%20som%20heter%20Postillien.%20D%C3%A4r%20samlar%20jag%20mina%20n%C3%A4tk%C3%B6p%2C%20produktgarantier%20och%20mycket%20annat%20smart%20och%20f%C3%A5r%20v%C3%A4ldigt%20bra%20koll%20p%C3%A5%20mina%20favoritbutiker%20och%20leverant%C3%B6rer%20och%20fakturor.%20Allt%20samlat%20under%20ett%20tak.%20Testa%20g%C3%A4rna%2C%20du%20hittar%20den%20om%20du%20s%C3%B6ker%20p%C3%A5%20Postillien." target="_blank" style="padding:8px 12px;background:#25D366;border-radius:7px;color:#fff;text-decoration:none;font-size:12px;">💬 WhatsApp</a>
        <a href="https://www.linkedin.com/sharing/share-offsite/?url=https://postillien.se" target="_blank" style="padding:8px 12px;background:#0A66C2;border-radius:7px;color:#fff;text-decoration:none;font-size:12px;">💼 LinkedIn</a>
      </div>
    </div>
  </div>`;
  modal.addEventListener('click', function(e){ if(e.target===this) this.style.display='none'; });
  document.body.appendChild(modal);
}

// ── MITT HUS ──
// Defaultvärden: logistikbolag + butiker blandade (bakåtkompatibelt)
let myWindows = ['PostNord','DHL','Vinted','Tradera','Marketplace','ASOS'];

async function loadMyHouse() {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const { data, error } = await _supa.from('house_windows').select('*').eq('user_id', session.user.id).single();
  if(!error && data && data.windows && data.windows.length > 0) {
    myWindows = data.windows;
  }
  // Säkerhetsnät: om inga logistikbolag finns, lägg till standard
  const hasLogistics = myWindows.some(n => LOGISTICS.find(x => x.name === n));
  const hasShops     = myWindows.some(n => !LOGISTICS.find(x => x.name === n) && n !== '__cellar_unlocked__');
  if(!hasLogistics) myWindows = [...myWindows, 'PostNord', 'DHL'];
  if(!hasShops)     myWindows = [...myWindows, 'Vinted', 'Tradera', 'Marketplace'];
}

async function saveMyHouse() {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  await _supa.from('house_windows').upsert({
    user_id: session.user.id,
    windows: myWindows,
    updated_at: new Date().toISOString()
  });
}

// ══════════════════════════════════════════════════════════
// MITT HUS — Ny rendering med vind (logistik) + fönster (butiker)
// ══════════════════════════════════════════════════════════
function renderMyHouse(el) {
  el.innerHTML = topbar('🏠 Mitt hus');
  const c = document.createElement('div');
  c.className = 'content';

  const myLogistics = myWindows.filter(n => LOGISTICS.find(x => x.name === n));
  let myShops       = myWindows.filter(n => !LOGISTICS.find(x => x.name === n) && n !== '__cellar_unlocked__');
  if(houseSettings && houseSettings.sortShops) myShops = [...myShops].sort((a,b)=>a.localeCompare(b,'sv'));

  // ── Kartong på vinden ──
  function makeBox(name, x, y) {
    const cv = LOGISTICS.find(x2 => x2.name === name) || {name, color:'#888780', url:''};
    const s = name.length > 8 ? name.slice(0,7)+'…' : name;
    const clickAction = cv.url
      ? `window.open('${cv.url}','_blank')`
      : `toggleCarrierInHouse('${name}')`;
    // Beräkna snittbetyg
    const rated = shipments.filter(sh => sh.carrier === name && sh.rating);
    const avgRating = rated.length > 0 ? (rated.reduce((a,sh)=>a+sh.rating,0)/rated.length).toFixed(1) : null;
    const ratingText = avgRating ? `<text x="${x+27}" y="${y+39}" text-anchor="middle" font-size="7" fill="#FAC775" font-family="DM Sans,sans-serif">⭐${avgRating}</text>` : '';
    return `<g onclick="${clickAction}" style="cursor:pointer;" title="${name}${cv.url?' — klicka för att spåra':''}">
      <rect x="${x}" y="${y}" width="54" height="40" rx="4" fill="${cv.color}20" stroke="${cv.color}" stroke-width="1.3"/>
      <rect x="${x}" y="${y}" width="54" height="14" rx="4" fill="${cv.color}" opacity=".85"/>
      <line x1="${x+27}" y1="${y+14}" x2="${x+27}" y2="${y+40}" stroke="${cv.color}" stroke-width=".8" opacity=".3"/>
      <line x1="${x}" y1="${y+27}" x2="${x+54}" y2="${y+27}" stroke="${cv.color}" stroke-width=".8" opacity=".3"/>
      <text x="${x+27}" y="${y+10.5}" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" font-family="DM Sans,sans-serif">${s}</text>
      <text x="${x+27}" y="${y+28}" text-anchor="middle" font-size="11" font-family="DM Sans,sans-serif">📦</text>
      ${ratingText}
    </g>`;
  }

  // ── Fönster i huset ──
  function makeWindow(name, x, y) {
    const cv = [...SHOPS, ...LOGISTICS].find(x2 => x2.name === name) || {name, color:'#888780', url:''};
    const s = name.length > 9 ? name.slice(0,8)+'…' : name;
    const clickAction = cv.url
      ? `window.open('${cv.url}','_blank')`
      : `toggleCarrierInHouse('${name}')`;
    // Beräkna snittbetyg
    const rated = shipments.filter(sh => sh.carrier === name && sh.rating);
    const avgRating = rated.length > 0 ? (rated.reduce((a,sh)=>a+sh.rating,0)/rated.length).toFixed(1) : null;
    const ratingText = avgRating ? `<text x="${x+31}" y="${y+70}" text-anchor="middle" font-size="8" fill="#FAC775" font-family="DM Sans,sans-serif">⭐${avgRating}</text>` : `<text x="${x+31}" y="${y+70}" text-anchor="middle" font-size="13" font-family="DM Sans,sans-serif">🛍️</text>`;
    return `<g onclick="${clickAction}" style="cursor:pointer;" title="${name}${cv.url?' — klicka för att besöka':' — klicka för att ta bort'}">
      <rect x="${x}" y="${y}" width="62" height="72" rx="5" fill="${cv.color}18" stroke="${cv.color}" stroke-width="1.3"/>
      <rect x="${x}" y="${y}" width="62" height="19" rx="5" fill="${cv.color}" opacity=".9"/>
      <line x1="${x+31}" y1="${y+19}" x2="${x+31}" y2="${y+72}" stroke="${cv.color}" stroke-width="1" opacity=".25"/>
      <line x1="${x}" y1="${y+45}" x2="${x+62}" y2="${y+45}" stroke="${cv.color}" stroke-width="1" opacity=".25"/>
      <text x="${x+31}" y="${y+13}" text-anchor="middle" font-size="9" font-weight="600" fill="#fff" font-family="DM Sans,sans-serif">${s}</text>
      <text x="${x+31}" y="${y+38}" text-anchor="middle" font-size="13" font-family="DM Sans,sans-serif">🛍️</text>
      ${ratingText}
    </g>`;
  }

  // ── Layout-konstanter ──
  const DOOR_W    = 62;
  const DOOR_X    = 309;
  const FLOOR_H   = 100;
  const W_XS      = [192, 267, 342, 417];
  const CELLAR_H  = 88;
  const GROUND_H  = 28;

  // ── VINDEN — placera lådor säkert inuti taket ──
  // Taket: spets vid (340, TIP_Y), bas vid y=ROOF_Y, x från 120 till 560 (bredd 440)
  const BOX_W = 48; const BOX_H = 38; const BOX_GAP = 8; const MARGIN = 12;
  const TIP_Y = 10;
  const ROOF_BASE_X = 120; const ROOF_TIP_X = 340; const ROOF_BASE_R = 560;

  // Funktion: tillgänglig bredd i triangeln vid en given y, minus marginal
  // Triangeln: vid y, halv-bredd = (y - TIP_Y) / (ROOF_Y_val - TIP_Y) * 220
  // Vi vet inte ROOF_Y ännu, men vi beräknar den iterativt

  // Steg 1: bestäm hur många rader som behövs och hur stor ROOF_H ska vara
  // Strategi: packa lådorna nerifrån och upp (rad 0 = botten = bredast)
  // Rad r (nerifrån): max antal lådor = floor((tillgänglig_bredd_vid_den_raden - 2*MARGIN) / (BOX_W + BOX_GAP)) + 1
  // Vi börjar med en ROOF_H och justerar

  function calcLayout(roofH) {
    const ROOF_Y_val = TIP_Y + roofH;
    const rows = [];
    let remaining = myLogistics.length;
    let r = 0;
    while(remaining > 0) {
      // y-centrum för denna rad (nerifrån: r=0 är botten)
      const rowCenterY = ROOF_Y_val - MARGIN - BOX_H/2 - r * (BOX_H + BOX_GAP);
      if(rowCenterY - BOX_H/2 < TIP_Y + MARGIN) break; // inte plats
      // Triangelns halvbredd vid överkant av lådorna (mest restriktivt)
      const checkY = rowCenterY - BOX_H/2;
      const halfW = (checkY - TIP_Y) / roofH * 220;
      const availW = halfW * 2 - MARGIN * 2;
      const maxBoxes = Math.max(1, Math.floor((availW + BOX_GAP) / (BOX_W + BOX_GAP)));
      const boxesThisRow = Math.min(maxBoxes, remaining);
      rows.unshift({ centerY: rowCenterY, count: boxesThisRow }); // unshift = rad 0 hamnar överst i array
      remaining -= boxesThisRow;
      r++;
    }
    return { rows, fits: remaining === 0, ROOF_Y_val };
  }

  // Steg 2: hitta minsta ROOF_H där alla lådor får plats
  let ROOF_H = 100;
  let layout = calcLayout(ROOF_H);
  while(!layout.fits && ROOF_H < 500) {
    ROOF_H += 10;
    layout = calcLayout(ROOF_H);
  }
  const ROOF_Y = layout.ROOF_Y_val;

  // Steg 3: generera SVG för lådorna
  let vindBoxes = '';
  let boxIndex = 0;
  layout.rows.forEach(row => {
    const totalW = row.count * BOX_W + (row.count - 1) * BOX_GAP;
    for(let c = 0; c < row.count; c++) {
      const bx = ROOF_TIP_X - totalW/2 + c * (BOX_W + BOX_GAP);
      const by = row.centerY - BOX_H/2;
      vindBoxes += makeBox(myLogistics[boxIndex], bx, by);
      boxIndex++;
    }
  });

  // Antal våningar = ceil(myShops.length / 4), minst 1
  const numFloors = Math.max(1, Math.ceil(myShops.length / 4));

  // Beräkna total SVG-höjd
  const houseTop    = ROOF_Y;
  const houseHeight = numFloors * FLOOR_H;
  const cellarTop   = houseTop + houseHeight;
  const groundY     = cellarTop + CELLAR_H;
  const svgH        = groundY + GROUND_H + 10;

  // Våningsrektanglar + fönster (byggs uppifrån, våning 1 = översta)
  // Markplan = understa våningen (index numFloors-1) — har dörr
  let floorRects = '';
  let floorWindows = '';
  for(let f = 0; f < numFloors; f++) {
    const fy     = houseTop + f * FLOOR_H;
    const isGround = (f === numFloors - 1);
    const fillCol  = f % 2 === 0 ? '#26215C' : '#272060';
    floorRects += `<rect x="175" y="${fy}" width="330" height="${FLOOR_H}" fill="${fillCol}" stroke="#3C3489" stroke-width=".5"/>`;
    if(f > 0) floorRects += `<line x1="175" y1="${fy}" x2="505" y2="${fy}" stroke="#3C3489" stroke-width="1.5"/>`;

    const shopSlice = myShops.slice(f * 4, f * 4 + 4);
    const winY = fy + (FLOOR_H - 72) / 2;

    if(isGround) {
      // Markplan: fönster vänster + höger om dörren (index 0 och 1 från denna rad)
      if(shopSlice[0]) floorWindows += makeWindow(shopSlice[0], 192, winY);
      if(shopSlice[1]) floorWindows += makeWindow(shopSlice[1], 417, winY);
      // Dörr
      const doorH = FLOOR_H - 8;
      const doorY = fy + 8;
      const handleY = fy + FLOOR_H * 0.55;
      floorWindows += `
        <rect x="${DOOR_X}" y="${doorY}" width="${DOOR_W}" height="${doorH}" rx="5" fill="#3C3489" stroke="#7F77DD" stroke-width="1.3"/>
        <rect x="${DOOR_X+8}" y="${doorY+8}" width="22" height="14" rx="2.5" fill="#26215C"/>
        <rect x="${DOOR_X+32}" y="${doorY+8}" width="22" height="14" rx="2.5" fill="#26215C"/>
        <rect x="${DOOR_X+8}" y="${doorY+26}" width="46" height="18" rx="2.5" fill="#26215C"/>
        <rect x="${DOOR_X+8}" y="${doorY+48}" width="46" height="18" rx="2.5" fill="#26215C"/>
        <rect x="${DOOR_X+8}" y="${doorY+70}" width="46" height="${doorH-78}" rx="2.5" fill="#26215C"/>
        <circle class="door-glow" cx="${DOOR_X+31}" cy="${handleY}" r="10" fill="#FFCD00"/>
        <circle class="door-handle" cx="${DOOR_X+31}" cy="${handleY}" r="5" fill="#FFCD00" style="cursor:pointer;" onclick="openCellarModal()"/>`;
    } else {
      // Vanlig våning: 4 fönster
      shopSlice.forEach((name, wi) => {
        floorWindows += makeWindow(name, W_XS[wi], winY);
      });
    }
  }

  // Källare — 4 fönster, bredare (x: 155, bredd 370)
  // Fönsterbredd 66px, gap ~14px, 4st → 4*66 + 3*14 = 306px → startx = 155 + (370-306)/2 = 187
  const CW = 62; const CG = 16; const CX0 = 175;
  function cellarCell(x, label, color, borderColor, onclick) {
    const isTxt = label.length > 4;
    return `
    <rect x="${x}" y="${cellarTop+10}" width="${CW}" height="52" rx="3" fill="#1A1730" stroke="${borderColor}" stroke-width="${borderColor==="#FFCD00"?'.8':'.5'}" style="cursor:pointer;" onclick="${onclick}"/>
    <rect x="${x}" y="${cellarTop+10}" width="${CW}" height="15" rx="3" fill="${color}"/>
    <line x1="${x+CW/2}" y1="${cellarTop+25}" x2="${x+CW/2}" y2="${cellarTop+62}" stroke="${color}" stroke-width="1.2" opacity=".6"/>
    <line x1="${x}" y1="${cellarTop+43}" x2="${x+CW}" y2="${cellarTop+43}" stroke="${color}" stroke-width="1.2" opacity=".6"/>
    <text x="${x+CW/2}" y="${cellarTop+21}" text-anchor="middle" font-size="${isTxt?'7.5':'9'}" fill="${borderColor==="#FFCD00"?'#FFCD00':'#AFA9EC'}" font-family="DM Sans,sans-serif" style="pointer-events:none;">${label}</text>`;
  }
  const c1x = CX0;
  const c2x = CX0 + CW + CG;
  const c3x = CX0 + (CW + CG)*2;
  const c4x = CX0 + (CW + CG)*3;

  const cellar = `
    <rect x="155" y="${cellarTop}" width="370" height="${CELLAR_H}" fill="#191630" stroke="#3C3489" stroke-width=".5"/>
    <rect x="155" y="${cellarTop-4}" width="370" height="8" fill="#2D2570"/>
    ${cellarCell(c1x, '🗄️ Arkiv',      '#26215C', '#534AB7', 'openCellarModal()')}
    ${cellarCell(c2x, '📊 Statistik',   '#26215C', '#534AB7', 'openCellarModal()')}
    ${cellarCell(c3x, '💎 Skattkam.',   '#2D2A10', '#FFCD00', 'openCellarModal()')}
    ${cellarCell(c4x, '📖 Om oss',       '#1E1C3A', '#7F77DD', 'openAboutModal()')}`;

  // Mark & text
  const ground = `
    <rect x="0" y="${groundY}" width="680" height="10" fill="#1D3A20"/>
    <ellipse cx="155" cy="${groundY-1}" rx="30" ry="17" fill="#1D3A20"/>
    <ellipse cx="143" cy="${groundY-3}" rx="20" ry="12" fill="#2A5A2A"/>
    <ellipse cx="525" cy="${groundY-1}" rx="30" ry="17" fill="#1D3A20"/>
    <ellipse cx="537" cy="${groundY-3}" rx="20" ry="12" fill="#2A5A2A"/>
    <text x="340" y="${groundY+22}" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="DM Sans,sans-serif">Alla försändelser under samma tak</text>
    <!-- TRÄD — växer med antal användare -->
    <g id="community-tree"></g>`;

  // Dörrhandle animation — transform-origin beräknas dynamiskt
  const groundFloorY   = houseTop + (numFloors - 1) * FLOOR_H;
  const handleAnimY    = groundFloorY + FLOOR_H * 0.55;
  const handleOrigin   = `${DOOR_X+31}px ${handleAnimY}px`;

  c.innerHTML = `
    <div class="card" style="margin-bottom:1rem;">
      <div class="card-title" style="margin-bottom:0.75rem;">Mitt hus · ${numFloors} våning${numFloors>1?'ar':''}</div>

      <style>
        .sa1{animation:puffApp 8s 0s ease-in-out infinite}
        .sa2{animation:puffApp 8s 1.5s ease-in-out infinite}
        .sa3{animation:puffApp 8s 3s ease-in-out infinite}
        @keyframes puffApp{0%{transform:translateY(0) scale(1);opacity:.25}50%{transform:translateY(-18px) scale(1.35);opacity:.12}100%{transform:translateY(-36px) scale(1.7);opacity:0}}
        .smoke-lbl{animation:riseApp 8s ease-in-out infinite}
        @keyframes riseApp{0%{transform:translateY(0);opacity:0}10%{opacity:1}70%{transform:translateY(-40px);opacity:1}100%{transform:translateY(-65px);opacity:0}}
        .door-handle{animation:pulseH 6s ease-in-out infinite;transform-origin:${handleOrigin}}
        .door-glow{animation:glowH 6s ease-in-out infinite}
        @keyframes pulseH{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
        @keyframes glowH{0%,100%{opacity:0}50%{opacity:.25}}
      </style>

      <svg id="house-svg" width="100%" viewBox="0 0 680 ${svgH}" style="cursor:default;background:transparent;">
        <!-- Nattbakgrund — döljs i monokromt läge via CSS -->
        <rect class="sky-bg" width="680" height="${svgH}" fill="#1E1A3A"/>
        <circle cx="60" cy="22" r="1.1" fill="#AFA9EC" opacity=".5"/>
        <circle cx="190" cy="14" r=".9" fill="#AFA9EC" opacity=".4"/>
        <circle cx="340" cy="26" r="1.1" fill="#AFA9EC" opacity=".6"/>
        <circle cx="470" cy="16" r=".9" fill="#AFA9EC" opacity=".5"/>
        <circle cx="580" cy="22" r="1.1" fill="#AFA9EC" opacity=".4"/>

        <!-- TAK — bredare än huset, dynamisk höjd -->
        <polygon points="340,10 ${ROOF_BASE_X},${ROOF_Y} ${ROOF_BASE_R},${ROOF_Y}" fill="#2A2358" stroke="#534AB7" stroke-width="1.5"/>
        <polygon points="340,10 ${ROOF_BASE_R},${ROOF_Y} ${ROOF_BASE_R-15},${ROOF_Y} 340,22 ${ROOF_BASE_X+15},${ROOF_Y} ${ROOF_BASE_X},${ROOF_Y}" fill="rgba(0,0,0,0.12)"/>
        <line x1="340" y1="10" x2="340" y2="${ROOF_Y}" stroke="#534AB7" stroke-width=".5" opacity=".3"/>

        <!-- Skorsten -->
        <rect x="450" y="66" width="28" height="72" rx="2" fill="#2D2570" stroke="#534AB7" stroke-width=".5"/>
        <rect x="446" y="62" width="36" height="8" rx="2" fill="#534AB7"/>
        <ellipse class="sa1" cx="464" cy="54" rx="9" ry="5.5" fill="#AFA9EC"/>
        <ellipse class="sa2" cx="467" cy="42" rx="7" ry="4.5" fill="#AFA9EC"/>
        <ellipse class="sa3" cx="463" cy="32" rx="5.5" ry="3.5" fill="#AFA9EC"/>
        <g class="smoke-lbl">
          <text x="443" y="58" font-size="11.5" font-weight="500" fill="#FFCD00" font-family="DM Sans,sans-serif">Post</text>
          <text x="466" y="58" font-size="11.5" font-weight="500" fill="#AFA9EC" font-family="DM Sans,sans-serif">illien</text>
        </g>

        <!-- Kartonger på vinden -->
        ${vindBoxes}

        <!-- Våningar -->
        ${floorRects}
        ${floorWindows}

        <!-- Källare -->
        ${cellar}

        <!-- Mark -->
        ${ground}
      </svg>
    </div>

    <!-- LOGISTIKBOLAG -->
    <div class="card" style="margin-bottom:1rem;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;">
        <div class="card-title">📦 Logistikbolag</div>
        <span style="font-size:11px;color:var(--text-dim);">${myLogistics.length}/7 valda</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;" class="logistics-grid">
        ${LOGISTICS.map(cv => {
          const active = myLogistics.includes(cv.name);
          return '<div onclick="toggleCarrierInHouse(\'' + cv.name + '\')" style="border:0.5px solid ' + (active?cv.color:'var(--border)') + ';background:' + (active?cv.color+'1A':'transparent') + ';border-radius:9px;padding:9px 6px;cursor:pointer;text-align:center;transition:all 0.15s;">' +
            '<div style="display:flex;align-items:center;justify-content:center;gap:4px;">' +
            '<div style="width:7px;height:7px;border-radius:50%;background:' + cv.color + ';flex-shrink:0;"></div>' +
            '<div style="font-size:11px;color:var(--text);font-weight:' + (active?'600':'400') + ';">' + cv.name + '</div>' +
            (active ? '<div style="color:#1D9E75;font-size:11px;">✓</div>' : '') +
            '</div>' +
            '<div style="font-size:9px;color:var(--text-dim);margin-top:3px;">' + cv.desc + '</div></div>';
        }).join('')}
      </div>
    </div>

    <!-- KÖPSTÄLLEN -->
    <div class="card">

async function drawCommunityTree() {
  // Hämta användarens egna inloggningsantal från Supabase
  var loginCount = 1;
  var totalUsers = 1;
  try {
    const { data: { session } } = await _supa.auth.getSession();
    if(session) {
      // Hämta/uppdatera inloggningsräknaren för denna användare
      const uid = session.user.id;
      const { data: profData } = await _supa.from('house_windows').select('login_count').eq('user_id', uid).single();
      if(profData && profData.login_count) {
        loginCount = profData.login_count;
      }
      // Hämta totalt antal användare (för admin-blommor)
      const { data: userCount } = await _supa.rpc('get_user_count');
      if(userCount) totalUsers = userCount;
    }
  } catch(e) { loginCount = 1; }

  const treeEl = document.getElementById('community-tree');
  if(!treeEl) return;

  const svg = document.getElementById('house-svg');
  const vb = svg ? svg.getAttribute('viewBox').split(' ') : ['0','0','680','500'];
  const svgH = parseFloat(vb[3]);
  const groundY = svgH - 38;
  const tx = 610;

  // Trädet växer baserat på egna inloggningar
  var treeSVG = '';
  if(loginCount <= 3) {
    treeSVG = '<ellipse cx="' + tx + '" cy="' + (groundY+2) + '" rx="8" ry="4" fill="#2A5A2A"/>'
      + '<line x1="' + tx + '" y1="' + groundY + '" x2="' + tx + '" y2="' + (groundY-12) + '" stroke="#5D8A3C" stroke-width="2" stroke-linecap="round"/>'
      + '<ellipse cx="' + (tx+4) + '" cy="' + (groundY-14) + '" rx="5" ry="4" fill="#4CAF50"/>';
  } else if(loginCount <= 10) {
    treeSVG = '<ellipse cx="' + tx + '" cy="' + (groundY+2) + '" rx="10" ry="5" fill="#2A5A2A"/>'
      + '<line x1="' + tx + '" y1="' + groundY + '" x2="' + tx + '" y2="' + (groundY-28) + '" stroke="#5D8A3C" stroke-width="3" stroke-linecap="round"/>'
      + '<ellipse cx="' + (tx-13) + '" cy="' + (groundY-23) + '" rx="7" ry="5" fill="#66BB6A"/>'
      + '<ellipse cx="' + (tx+13) + '" cy="' + (groundY-27) + '" rx="7" ry="5" fill="#4CAF50"/>'
      + '<ellipse cx="' + tx + '" cy="' + (groundY-30) + '" rx="9" ry="7" fill="#66BB6A"/>';
  } else if(loginCount <= 30) {
    treeSVG = '<ellipse cx="' + tx + '" cy="' + (groundY+3) + '" rx="12" ry="6" fill="#2A5A2A"/>'
      + '<rect x="' + (tx-5) + '" y="' + (groundY-50) + '" width="10" height="52" rx="3" fill="#795548"/>'
      + '<ellipse cx="' + tx + '" cy="' + (groundY-55) + '" rx="22" ry="18" fill="#388E3C"/>'
      + '<ellipse cx="' + (tx-12) + '" cy="' + (groundY-48) + '" rx="14" ry="12" fill="#43A047"/>'
      + '<ellipse cx="' + (tx+12) + '" cy="' + (groundY-48) + '" rx="14" ry="12" fill="#2E7D32"/>'
      + '<ellipse cx="' + tx + '" cy="' + (groundY-65) + '" rx="16" ry="13" fill="#66BB6A"/>';
  } else if(loginCount <= 100) {
    treeSVG = '<ellipse cx="' + tx + '" cy="' + (groundY+3) + '" rx="14" ry="7" fill="#1B5E20"/>'
      + '<rect x="' + (tx-6) + '" y="' + (groundY-75) + '" width="12" height="78" rx="3" fill="#5D4037"/>'
      + '<ellipse cx="' + tx + '" cy="' + (groundY-80) + '" rx="28" ry="24" fill="#2E7D32"/>'
      + '<ellipse cx="' + (tx-16) + '" cy="' + (groundY-70) + '" rx="18" ry="15" fill="#388E3C"/>'
      + '<ellipse cx="' + (tx+16) + '" cy="' + (groundY-70) + '" rx="18" ry="15" fill="#1B5E20"/>'
      + '<ellipse cx="' + tx + '" cy="' + (groundY-95) + '" rx="20" ry="17" fill="#43A047"/>';
  } else {
    treeSVG = '<ellipse cx="' + tx + '" cy="' + (groundY+3) + '" rx="16" ry="8" fill="#1B5E20"/>'
      + '<rect x="' + (tx-7) + '" y="' + (groundY-90) + '" width="14" height="93" rx="4" fill="#4E342E"/>'
      + '<ellipse cx="' + tx + '" cy="' + (groundY-95) + '" rx="32" ry="28" fill="#C8E6C9"/>'
      + '<ellipse cx="' + (tx-18) + '" cy="' + (groundY-82) + '" rx="20" ry="17" fill="#F8BBD0"/>'
      + '<ellipse cx="' + (tx+18) + '" cy="' + (groundY-82) + '" rx="20" ry="17" fill="#F48FB1"/>'
      + '<ellipse cx="' + tx + '" cy="' + (groundY-112) + '" rx="22" ry="19" fill="#F8BBD0"/>'
      + '<circle cx="' + (tx-20) + '" cy="' + (groundY-88) + '" r="4" fill="#E91E63" opacity=".8"/>'
      + '<circle cx="' + (tx+15) + '" cy="' + (groundY-92) + '" r="3.5" fill="#E91E63" opacity=".8"/>';
  }

  // Admin-blommor på marken (diskret, bara admin förstår)
  // 🤍 vit = per 10 användare, 💛 gul = per 100, 🧡 orange = per 1000
  var thousands = Math.floor(totalUsers / 1000);
  var hundreds  = Math.floor((totalUsers % 1000) / 100);
  var tens      = Math.floor((totalUsers % 100) / 10);

  var flowerSVG = '';
  var fx = tx - 40;
  var fy = groundY + 3;

  function flower(x, color, size) {
    size = size || 4;
    return '<circle cx="' + x + '" cy="' + fy + '" r="' + size + '" fill="' + color + '" opacity="0.7"/>'
      + '<circle cx="' + (x-size) + '" cy="' + (fy-size) + '" r="' + (size*0.6) + '" fill="' + color + '" opacity="0.5"/>'
      + '<circle cx="' + (x+size) + '" cy="' + (fy-size) + '" r="' + (size*0.6) + '" fill="' + color + '" opacity="0.5"/>';
  }

  var flowerX = tx - 55;
  for(var i = 0; i < Math.min(thousands, 5); i++) {
    flowerSVG += flower(flowerX + i*10, '#FF8C00', 5);
  }
  flowerX = tx - 55 + Math.min(thousands,5)*10;
  for(var j = 0; j < Math.min(hundreds, 9); j++) {
    flowerSVG += flower(flowerX + j*8, '#FFD700', 3.5);
  }
  flowerX += Math.min(hundreds,9)*8;
  for(var k = 0; k < Math.min(tens, 9); k++) {
    flowerSVG += flower(flowerX + k*6, '#FFFFFF', 2.5);
  }

  treeEl.innerHTML = treeSVG + flowerSVG;
}

// ── TOGGLE CARRIER (uppdaterad med logistik/shop-separering) ──
function toggleCarrierInHouse(name) {
  if(name === 'Valfritt') {
    openCustomWindowModal();
    return;
  }

  const isLogistics = !!LOGISTICS.find(x => x.name === name);
  const myLogistics = myWindows.filter(n => LOGISTICS.find(x => x.name === n));
  const myShops     = myWindows.filter(n => !LOGISTICS.find(x => x.name === n) && n !== '__cellar_unlocked__');

  if(myWindows.includes(name)) {
    // Ta bort
    if(isLogistics && myLogistics.length <= 1) {
      alert('Du måste ha minst ett logistikbolag på vinden!');
      return;
    }
    if(!isLogistics && myShops.length <= 1) {
      alert('Du måste ha minst ett köpställe i fönstren!');
      return;
    }
    myWindows = myWindows.filter(n => n !== name);
  } else {
    // Lägg till
    if(isLogistics && myLogistics.length >= 7) {
      alert('Vinden har plats för max 7 logistikbolag!');
      return;
    }
    // Köpställen: ingen övre gräns — varje 4 butiker = ny våning automatiskt
    myWindows.push(name);
  }
  saveMyHouse();
  showView('myhouse');
}

function saveCustomWindow() {
  var name = document.getElementById('custom-window-name').value.trim();
  var url  = document.getElementById('custom-window-url').value.trim();
  if(!name) { alert('Ange ett namn.'); return; }
  // Lägg till i SHOPS-listan med URL så klicket fungerar
  if(!SHOPS.find(x => x.name === name)) {
    SHOPS.splice(SHOPS.length - 1, 0, {name, color:'#888780', desc:'Min butik', url});

  myWindows.push(name);
  document.getElementById('custom-window-modal').style.display='none';
  document.getElementById('custom-window-name').value='';
  document.getElementById('custom-window-url').value='';
  saveMyHouse();
  showView('myhouse');

      saveMyHouse();
    }
    showView('myhouse');
  }
}

var wishFilter = 'all';
var wishSearch = '';

function setWishFilter(f) {
  wishFilter = f;
  ['all','pending','bought'].forEach(x => {
    var el = document.getElementById('wf-'+x);
    if(el) el.className = 'filter' + (x===f?' active':'');
  });
  updateWishList();
}

function filterWishlists(q) {
  wishSearch = q.toLowerCase();
  updateWishList();
}

function updateWishList() {
  let list = wishlists;
  if(wishFilter === 'pending') list = list.filter(w=>!w.bought);
  if(wishFilter === 'bought') list = list.filter(w=>w.bought);
  if(wishSearch) list = list.filter(w => w.person.toLowerCase().includes(wishSearch) || w.wish.toLowerCase().includes(wishSearch));
  var el = document.getElementById('wish-list');
  if(el) el.innerHTML = renderWishRows(list);
}

function renderWishRows(list) {
  if(list.length === 0) return '<div style="font-size:13px;color:var(--text-dim);padding:1rem 0;text-align:center;">Inga önskemål här</div>';
  return list.map(w => `
  <div style="border-top:0.5px solid var(--border);padding:12px 0;display:flex;align-items:flex-start;gap:12px;">
    <button onclick="toggleBought('${w.id}')" style="width:22px;height:22px;border-radius:6px;border:1.5px solid ${w.bought?'var(--teal)':'var(--border)'};background:${w.bought?'var(--teal)':'transparent'};cursor:pointer;flex-shrink:0;margin-top:2px;font-size:12px;color:white;">${w.bought?'✓':''}</button>
    <div style="flex:1;${w.bought?'opacity:0.5;text-decoration:line-through;':''}">
      <div style="font-size:13px;font-weight:500;color:var(--text);">${w.person}${w.occasion?' — '+w.occasion:''}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${w.wish}</div>
      ${w.note?`<div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${w.note}</div>`:''}
      ${w.link?`<div style="font-size:11px;color:var(--purple-pale);margin-top:2px;">🔗 ${w.link}</div>`:''}
    </div>
    <div style="text-align:right;flex-shrink:0;">
      ${w.price?`<div style="font-size:13px;font-weight:500;color:var(--text);">~${w.price} kr</div>`:''}
      <button onclick="deleteWish('${w.id}')" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:4px;" title="Ta bort">🗑️</button>
    </div>
  </div>`).join('');
}

function openWishModal() {
  var modal = document.getElementById('wish-modal');
  if(modal) {
    modal.style.display = 'flex';
    ['w-person','w-wish','w-occasion','w-link','w-note'].forEach(id => { var el=document.getElementById(id); if(el) el.value=''; });
    var price = document.getElementById('w-price'); if(price) price.value='';
  }
}

function closeWishModal() {
  var modal = document.getElementById('wish-modal');
  if(modal) modal.style.display = 'none';
}

async function saveWish() {
  const person = document.getElementById('w-person').value.trim();
  const wish = document.getElementById('w-wish').value.trim();
  if(!person || !wish) { alert('Fyll i vem och vad de önskar sig.'); return; }
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const { data, error } = await _supa.from('wishlists').insert([{
    user_id: session.user.id, person, wish,
    occasion: document.getElementById('w-occasion').value.trim(),
    price: parseFloat(document.getElementById('w-price').value) || 0,
    link: document.getElementById('w-link').value.trim(),
    note: document.getElementById('w-note').value.trim(),
    bought: false
  }]).select();
  if(error) { alert('Kunde inte spara: ' + error.message); return; }
  wishlists.unshift(data[0]);
  closeWishModal();
  showView('wishlists');
}

async function toggleBought(id) {
  const w = wishlists.find(x => x.id == id);
  if(!w) return;
  const newVal = !w.bought;
  const { error } = await _supa.from('wishlists').update({ bought: newVal }).eq('id', id);
  if(!error) { w.bought = newVal; updateWishList(); }
}

      <div style="display:flex;gap:12px;justify-content:center;margin-bottom:1.5rem;">

        <button id="fb-down" onclick="setFeedbackThumb('down')" style="width:52px;height:52px;border-radius:12px;border:0.5px solid var(--border);background:transparent;font-size:24px;cursor:pointer;transition:all 0.15s;">👎</button>

      <div id="fb-thanks" style="display:none;font-size:13px;color:var(--teal-light);text-align:center;margin-top:12px;">Tack för din feedback! 🙏</div>

var fbThumb = null;
function setFeedbackThumb(t) {
  fbThumb = t;
  var up = document.getElementById('fb-up');
  var down = document.getElementById('fb-down');
  if(up) up.style.background = t==='up' ? 'rgba(29,158,117,0.2)' : 'transparent';
  if(down) down.style.background = t==='down' ? 'rgba(226,75,74,0.2)' : 'transparent';
}
async function sendAppFeedback() {
  if(!fbThumb) { alert('Välj tumme upp eller ner först!'); return; }
  const comment = document.getElementById('fb-text').value.trim();

  const { data: { session } } = await _supa.auth.getSession();
  if(session) {
    await _supa.from('feedback').insert([{
      user_id: session.user.id,
      thumb: fbThumb,
      comment: comment
    }]);
  }

  document.getElementById('fb-thanks').style.display = 'block';
  document.getElementById('fb-text').value = '';
  fbThumb = null;
  var up = document.getElementById('fb-up');
  var down = document.getElementById('fb-down');
  if(up) up.style.background = 'transparent';
  if(down) down.style.background = 'transparent';
  setTimeout(() => { 
    var thanks = document.getElementById('fb-thanks');
    if(thanks) thanks.style.display = 'none'; 
  }, 3000);
}

function getPresentRows(list) {
  if(list.length === 0) return '<div style="font-size:13px;color:var(--text-dim);padding:1rem 0;text-align:center;">Inga presenter hittades</div>';
  return list.map(p => `
  <div style="border-top:0.5px solid var(--border);padding:12px 0;display:flex;align-items:flex-start;gap:12px;">
    <div style="flex:1;">
      <div style="font-size:13px;font-weight:500;color:var(--text);">${p.recipient} — ${p.occasion}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${p.gift}${p.supplier ? ' · ' + p.supplier : ''}</div>
      ${p.reaction ? '<div style="font-size:11px;color:var(--teal-light);margin-top:3px;">💬 ' + p.reaction + '</div>' : ''}
      ${p.tip ? '<div style="font-size:11px;color:#FAC775;margin-top:3px;">💡 Nästa gång: ' + p.tip + '</div>' : ''}
    </div>
    <div style="text-align:right;flex-shrink:0;">
      <div style="font-size:14px;font-weight:500;color:var(--text);">${p.amount ? p.amount.toLocaleString('sv') + ' kr' : '—'}</div>
      <div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${p.date || ''}</div>
      <button onclick="deletePresent('${p.id}')" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:4px;" title="Ta bort">🗑️</button>
    </div>
  </div>`).join('');
}

function filterPresents() {
  const q = document.getElementById('p-search')?.value.toLowerCase() || '';
  const year = document.getElementById('p-year')?.value || '';
  const occ = document.getElementById('p-occ')?.value || '';
  let list = presents;
  if(q) list = list.filter(p => p.recipient.toLowerCase().includes(q) || p.occasion.toLowerCase().includes(q) || p.gift.toLowerCase().includes(q));
  if(year) list = list.filter(p => p.date && p.date.startsWith(year));
  if(occ) list = list.filter(p => p.occasion.toLowerCase().includes(occ.toLowerCase()));
  const tbody = document.getElementById('present-list');
  if(tbody) tbody.innerHTML = getPresentRows(list);
}

  const selectedYear = window.presentYearFilter || '';

  // Filtrera per år om valt
  function filterYear(list) {
    if(!selectedYear) return list;
    return list.filter(p => p.date && p.date.startsWith(selectedYear));
  }

  const filteredGiven    = filterYear(given);
  const filteredReceived = filterYear(received);
  const filteredGroups   = filterYear(groups);

  el.innerHTML = topbar('🎁 Presenter', '<button class="btn btn-primary" onclick="openPresentTypeModal()">+ Lägg till</button>');
  const c = document.createElement('div');

  // År-filter knappar
  const yearBtns = [''].concat(years).map(y =>
    '<button onclick="setPresentYear(\'' + y + '\')" style="padding:5px 12px;border-radius:99px;font-size:12px;border:0.5px solid ' + (selectedYear === y ? 'var(--purple-light)' : 'var(--border)') + ';background:' + (selectedYear === y ? 'var(--bg3)' : 'transparent') + ';color:' + (selectedYear === y ? 'var(--purple-pale)' : 'var(--text-muted)') + ';cursor:pointer;font-family:inherit;">' + (y || 'Alla år') + '</button>'
  ).join('');

  function presentRow(p) {
    return '<div style="border-top:0.5px solid var(--border);padding:12px 0;display:flex;align-items:flex-start;gap:12px;">'
      + '<div style="flex:1;">'
      + '<div style="font-size:14px;font-weight:500;color:var(--text);">' + p.recipient + (p.occasion ? ' — ' + p.occasion : '') + '</div>'
      + '<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">' + p.gift + (p.supplier ? ' · ' + p.supplier : '') + '</div>'
      + (p.reaction ? '<div style="font-size:11px;color:var(--teal-light);margin-top:3px;">💬 ' + p.reaction + '</div>' : '')
      + (p.tip ? '<div style="font-size:11px;color:#FAC775;margin-top:3px;">💡 ' + p.tip + '</div>' : '')
      + '</div>'
      + '<div style="text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px;">'
      + (p.amount ? '<div style="font-size:14px;font-weight:500;color:var(--text);">' + p.amount.toLocaleString('sv') + ' kr</div>' : '')
      + (p.date ? '<div style="font-size:11px;color:var(--text-dim);">' + p.date + '</div>' : '')
      + '<div style="display:flex;gap:6px;">'
      + '<button onclick="editPresent(\'' + p.id + '\')" style="background:none;border:none;color:var(--purple-pale);cursor:pointer;font-size:14px;">✏️</button>'
      + '<button onclick="deletePresent(\'' + p.id + '\')" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;">🗑️</button>'
      + '</div>'
      + '</div>'
      + '</div>';
  }

  c.innerHTML = ''
    + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;">' + yearBtns + '</div>'

    + '<div class="card" style="margin-bottom:1rem;">'
    + '<div class="card-header"><span class="card-title" style="font-size:15px;font-weight:600;">🎁 Jag har gett</span><button onclick="openPresentModal(\'given\')" style="font-size:11px;color:var(--purple-pale);background:none;border:none;cursor:pointer;">+ Lägg till</button></div>'
    + (filteredGiven.length === 0 ? '<div style="font-size:13px;color:var(--text-dim);text-align:center;padding:0.75rem 0;">Inga gåvor' + (selectedYear ? ' för ' + selectedYear : '') + '</div>' : filteredGiven.map(presentRow).join(''))

    + '<div class="card" style="margin-bottom:1rem;">'
    + '<div class="card-header"><span class="card-title" style="font-size:15px;font-weight:600;">🎀 Jag har fått</span><button onclick="openPresentModal(\'received\')" style="font-size:11px;color:var(--purple-pale);background:none;border:none;cursor:pointer;">+ Lägg till</button></div>'
    + (filteredReceived.length === 0 ? '<div style="font-size:13px;color:var(--text-dim);text-align:center;padding:0.75rem 0;">Inga mottagna gåvor' + (selectedYear ? ' för ' + selectedYear : '') + '</div>' : filteredReceived.map(presentRow).join(''))
    + '</div>'

    + '<div class="card">'
    + '<div class="card-header"><span class="card-title" style="font-size:15px;font-weight:600;">👥 Grupppresent</span><button onclick="openGroupPresentModal()" style="font-size:11px;color:var(--purple-pale);background:none;border:none;cursor:pointer;">+ Skapa grupp</button></div>'
    + (filteredGroups.length === 0 ? '<div style="font-size:13px;color:var(--text-dim);text-align:center;padding:0.75rem 0;">Inga grupppresenter' + (selectedYear ? ' för ' + selectedYear : '') + '</div>' : filteredGroups.map(presentRow).join(''))

async function savePresent() {
  const recipient = document.getElementById('p-recipient').value.trim();
  const gift = document.getElementById('p-gift').value.trim();
  if(!recipient || !gift) { alert('Fyll i alla obligatoriska fält.'); return; }
  const direction = document.getElementById('p-direction').value;
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) { alert('Du måste vara inloggad.'); return; }
  const { data, error } = await _supa.from('presents').insert([{
    user_id: session.user.id, recipient, direction,
    occasion: document.getElementById('p-occasion').value.trim(),
    gift, amount: parseFloat(document.getElementById('p-amount').value) || 0,
    date: document.getElementById('p-date').value,
    supplier: (document.getElementById('p-supplier')?.value||'').trim(),
    reaction: document.getElementById('p-reaction').value.trim(),
    tip: (document.getElementById('p-tip')?.value||'').trim()
  }]).select();
  if(error) { alert('Kunde inte spara: ' + error.message); return; }
  presents.unshift({ ...data[0] });
  document.getElementById('present-modal').style.display = 'none';
  showView('presents');
}

function editPresent(id) {
  const p = presents.find(x => x.id == id);
  if(!p) return;
  if(p.direction === 'group') {
    openGroupPresentModal();
  } else {
    openPresentModal(p.direction || 'given');
  }
  // Fyll i befintliga värden
  setTimeout(() => {
    var el = (k) => document.getElementById(k);
    if(el('p-recipient')) el('p-recipient').value = p.recipient || '';
    if(el('p-occasion'))  el('p-occasion').value  = p.occasion  || '';
    if(el('p-gift'))      el('p-gift').value       = p.gift      || '';
    if(el('p-amount'))    el('p-amount').value     = p.amount    || '';
    if(el('p-date'))      el('p-date').value       = p.date      || '';
    if(el('p-supplier'))  el('p-supplier').value   = p.supplier  || '';
    if(el('p-reaction'))  el('p-reaction').value   = p.reaction  || '';
    if(el('p-tip'))       el('p-tip').value        = p.tip       || '';
    // Byt spara-knappen till uppdatera
    var btn = document.querySelector('#present-modal .btn-primary');
    if(btn) {
      btn.textContent = 'Spara ändringar';
      btn.onclick = function() { updatePresent(id); };
    }
  }, 50);
}

async function updatePresent(id) {
  const recipient = document.getElementById('p-recipient').value.trim();
  const gift = document.getElementById('p-gift').value.trim();
  if(!recipient || !gift) { alert('Fyll i alla obligatoriska fält.'); return; }
  const { error } = await _supa.from('presents').update({
    recipient,
    occasion:  document.getElementById('p-occasion').value.trim(),
    gift,
    amount:    parseFloat(document.getElementById('p-amount').value) || 0,
    date:      document.getElementById('p-date').value,
    supplier:  (document.getElementById('p-supplier')?.value||'').trim(),
    reaction:  document.getElementById('p-reaction').value.trim(),
    tip:       (document.getElementById('p-tip')?.value||'').trim()
  }).eq('id', id);
  if(error) { alert('Kunde inte spara: ' + error.message); return; }
  const p = presents.find(x => x.id == id);
  if(p) {
    p.recipient = recipient;
    p.occasion  = document.getElementById('p-occasion').value.trim();
    p.gift      = gift;
    p.amount    = parseFloat(document.getElementById('p-amount').value) || 0;
    p.date      = document.getElementById('p-date').value;
    p.reaction  = document.getElementById('p-reaction').value.trim();
    p.tip       = (document.getElementById('p-tip')?.value||'').trim();
  }
  document.getElementById('present-modal').style.display = 'none';
  showView('presents');
}
function closePresentModal() {
  var m = document.getElementById('present-modal');
  if(m) m.style.display = 'none';
}

function showView(v) {
  currentView = v;
  // Uppdatera bottom-nav
  ['dashboard','shipments','myhouse','invoices','presents'].forEach(name => {
    var btn = document.getElementById('bn-' + name);
    if(btn) btn.className = 'bottom-nav-item' + (name === v ? ' active' : '');
  });
  var moreBtn = document.getElementById('bn-more');
  if(moreBtn) moreBtn.className = 'bottom-nav-item' + (['wishlists','notifications','feedback','settings','archive','statistics','treasure'].includes(v) ? ' active' : '');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const items = document.querySelectorAll('.nav-item');
  const map = {dashboard:0,myhouse:1,shipments:2,invoices:3,notifications:4,presents:5,wishlists:6,feedback:7,settings:8};
  if(items[map[v]]) items[map[v]].classList.add('active');
  const main = document.getElementById('main');
  main.innerHTML = '';
  if(v==='dashboard') renderDashboard(main);
  else if(v==='shipments') renderShipments(main);
  else if(v==='invoices') renderInvoices(main);
  else if(v==='notifications') renderNotifications(main);
  else if(v==='myhouse') renderMyHouse(main);
  else if(v==='presents') renderPresents(main);
  else if(v==='wishlists') renderWishlists(main);
  else if(v==='feedback') renderFeedback(main);
  else if(v==='settings') renderSettings(main);
  else if(v==='archive') renderArchive(main);
  else if(v==='statistics') renderStatistics(main);
  else if(v==='treasure') renderTreasure(main);
}

function topbar(title, btn='') {
  const isHome = title.includes('Hemma') || title === 'Översikt';
  const homeBtn = isHome ? '' : '<button class="home-btn" onclick="showView(\'dashboard\')" title="Hem">⌂</button>';
  return `<div class="topbar"><div style="display:flex;align-items:center;gap:10px;">${homeBtn}<div class="topbar-title">${title}</div></div>${btn}</div>`;
}

function renderDashboard(el) {
  try {
  // Beräkningar
  const vantar    = shipments.filter(s => s.status !== 'delivered' && s.direction !== 'out').length;
  const skaSkicka = shipments.filter(s => s.status !== 'delivered' && s.direction === 'out').length;
  const unpaid    = invoices.filter(i => !i.paid && i.type === 'out').reduce((a,i) => a+i.amount, 0);

  // Gåvor att köpa — önskelistor ej köpta
  const gavokop = wishlists.filter(w => !w.bought).length;

  // Garantier som går ut inom 30 dagar
  const today = new Date();
  const in30 = new Date(); in30.setDate(in30.getDate() + 30);
  const garantier = archiveItems.filter(function(x) {
    if(x.type !== 'contract' || !x.expires) return false;
    var d = new Date(x.expires);
    return d >= today && d <= in30;
  }).length;

  const dashTitle = userName ? ('🏠 Hemma hos ' + userName) : '🏠 Hemma';
  el.innerHTML = topbar(dashTitle, '<button class="btn btn-primary" onclick="openModal()">+ Ny försändelse</button>');
  const c = document.createElement('div');
  c.className = 'content';

  function påminnelseKort(ikon, nummer, text, färg, view) {
    var harData = nummer > 0;
    return '<div onclick="showView(\'' + view + '\')" style="background:var(--bg2);border:0.5px solid ' + (harData ? färg : 'var(--border)') + ';border-radius:12px;padding:1rem;cursor:pointer;transition:all 0.15s;">'
      + '<div style="font-size:24px;margin-bottom:8px;">' + ikon + '</div>'
      + '<div style="font-size:' + (nummer > 99 ? '20px' : '26px') + ';font-weight:600;color:' + (harData ? färg : 'var(--text-dim)') + ';">' + nummer + '</div>'
      + '<div style="font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.4;">' + text + '</div>'

// ── ARKIV ──
let archiveItems = [];

async function loadArchive() {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const { data, error } = await _supa.from('archive').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false });
  if(!error && data) archiveItems = data;
}

async function saveArchiveItem(item) {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return null;
  const { data, error } = await _supa.from('archive').insert([{ ...item, user_id: session.user.id }]).select();
  if(!error && data) { archiveItems.unshift(data[0]); return data[0]; }
  return null;
}

async function deleteArchiveItem(id) {
  const { error } = await _supa.from('archive').delete().eq('id', id);
  if(!error) archiveItems = archiveItems.filter(x => x.id != id);
}

function openArchiveModal(type) {
  type = type || 'link';
  document.getElementById('arc-type').value = type;
  const titles = {link:'🔗 Lägg till länk', contract:'📄 Lägg till avtal/garanti', note:'📝 Lägg till anteckning'};
  document.getElementById('archive-modal-title').innerHTML = (titles[type]||'Lägg till') + ' <button class="close-btn" onclick="document.getElementById(\'archive-modal\').style.display=\'none\'">✕</button>';
  document.getElementById('arc-expires-wrap').style.display = type === 'contract' ? 'block' : 'none';
  document.getElementById('arc-photo-wrap').style.display  = type === 'contract' ? 'block' : 'none';
  document.getElementById('arc-url-wrap').style.display    = type === 'note' ? 'none' : 'block';
  document.getElementById('arc-title').value = '';
  document.getElementById('arc-url').value = '';
  document.getElementById('arc-note').value = '';
  document.getElementById('arc-photo').value = '';
  document.getElementById('arc-photo-preview').style.display = 'none';
  // Förhandsvisning av valt foto
  document.getElementById('arc-photo').onchange = function() {
    const file = this.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById('arc-preview-img').src = e.target.result;
        document.getElementById('arc-photo-preview').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  };
  document.getElementById('archive-modal').style.display = 'flex';
}

async function saveArchiveFromModal() {
  const title = document.getElementById('arc-title').value.trim();
  if(!title) { alert('Fyll i en titel.'); return; }

  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;

  // Ladda upp foto om det finns ett
  let image_url = null;
  const photoFile = document.getElementById('arc-photo').files[0];
  if(photoFile) {
    const ext = photoFile.name.split('.').pop();
    const path = `${session.user.id}/${Date.now()}.${ext}`;
    const { data: uploadData, error: uploadError } = await _supa.storage
      .from('public-files')
      .upload(path, photoFile, { upsert: true });
    if(!uploadError) {
      const { data: urlData } = _supa.storage.from('public-files').getPublicUrl(path);
      image_url = urlData.publicUrl;
    }
  }

  const item = {
    type: document.getElementById('arc-type').value,
    title,
    url: document.getElementById('arc-url').value.trim(),
    expires: document.getElementById('arc-expires').value || null,
    note: document.getElementById('arc-note').value.trim(),
    image_url,
  };
  const saved = await saveArchiveItem(item);
  if(saved) {
    document.getElementById('archive-modal').style.display = 'none';
    showView('archive');
  } else {
    alert('Kunde inte spara — kontrollera att tabellen "archive" finns i Supabase.');
  }
}

function renderStatistics(el) {
  el.innerHTML = topbar('📊 Statistik');
  const c = document.createElement('div');
  c.className = 'content';

  // Beräkna statistik från befintlig data
  const delivered   = shipments.filter(s => s.status === 'delivered');
  const active      = shipments.filter(s => s.status !== 'delivered');
  const totalCost   = invoices.filter(i => i.type === 'out').reduce((a,i) => a+i.amount, 0);
  const presentCost = presents.reduce((a,p) => a+(p.amount||0), 0);

  // Mest använda transportör
  const carrierCount = {};
  shipments.forEach(s => { carrierCount[s.carrier] = (carrierCount[s.carrier]||0) + 1; });
  const topCarrier = Object.entries(carrierCount).sort((a,b)=>b[1]-a[1])[0];

  // Betyg per butik
  const ratedShips = shipments.filter(s => s.rating);
  const shopRatings = {};
  ratedShips.forEach(s => {
    if(!shopRatings[s.carrier]) shopRatings[s.carrier] = [];
    shopRatings[s.carrier].push(s.rating);
  });
  const avgRatings = Object.entries(shopRatings).map(([name, ratings]) => ({
    name,
    avg: (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1),
    count: ratings.length
  })).sort((a,b) => b.avg - a.avg);

  var logisticsNames = LOGISTICS.map(function(l) { return l.name; });
  var transportorRatings = {};
  var shopRatings2 = {};
  shipments.filter(function(s) { return s.rating; }).forEach(function(s) {
    var isLog = logisticsNames.indexOf(s.carrier) !== -1;
    if(isLog) {
      if(!transportorRatings[s.carrier]) transportorRatings[s.carrier] = [];
      transportorRatings[s.carrier].push({rating: s.rating, note: s.rating_note});
    } else {
      if(!shopRatings2[s.carrier]) shopRatings2[s.carrier] = [];
      shopRatings2[s.carrier].push({rating: s.rating, note: s.rating_note});
    }
  });

  function ratingCard(ratingsObj, emptyText) {
    var entries = Object.entries(ratingsObj);
    if(entries.length === 0) return '<div style="font-size:13px;color:var(--text-dim);text-align:center;padding:0.75rem 0;">' + emptyText + '</div>';

      var name = entry[0]; var ratings = entry[1];

      var lastNote = ratings[ratings.length-1].note;

let treasureItems = [];

async function loadTreasure() {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const { data, error } = await _supa.from('treasure').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false });
  if(!error && data) treasureItems = data;
}

async function saveTreasureItem(item) {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return null;
  const { data, error } = await _supa.from('treasure').insert([{ ...item, user_id: session.user.id }]).select();
  if(!error && data) { treasureItems.unshift(data[0]); return data[0]; }
  return null;
}

async function deleteTreasureItem(id) {
  const { error } = await _supa.from('treasure').delete().eq('id', id);
  if(!error) treasureItems = treasureItems.filter(x => x.id != id);
}

// Kategorier för Skattkammaren
var TREASURE_CATEGORIES = [
  { id: 'loppis',      label: 'Köpt på loppis / begagnat',           color: '#8B5CF6' },
  { id: 'fynd',        label: 'Köpt som fynd / rea / kampanj',        color: '#EF9F27' },
  { id: 'arvt',        label: 'Tagit emot utan kostnad / Ärvt',       color: '#F97316' },
  { id: 'miljo',       label: 'Mitt miljöval',                        color: '#22C55E' },
  { id: 'skänkt',      label: 'Jag har skänkt begagnat till någon',   color: '#06B6D4' },
  { id: 'välgörenhet', label: 'Välgörenhet',                          color: '#EF4444' },
];

function diamondSVG(color, size) {
  size = size || 28;
  var h = size;
  var w = Math.round(size * 0.85);
  var cx = Math.round(w/2);
  var cy = Math.round(h/2);
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;">'
    + '<polygon points="' + cx + ',2 ' + (w-2) + ',' + (cy-2) + ' ' + cx + ',' + (h-2) + ' 2,' + (cy-2) + '" fill="' + color + '" opacity="0.9"/>'
    + '<polygon points="' + cx + ',2 ' + (w-2) + ',' + (cy-2) + ' ' + cx + ',' + cy + ' 2,' + (cy-2) + '" fill="white" opacity="0.2"/>'
    + '</svg>';
}

function getCategoryIcon(id) {
  var cat = TREASURE_CATEGORIES.find(function(c) { return c.id === id; });
  return cat ? diamondSVG(cat.color) : diamondSVG('#888780');
}
function getCategoryColor(id) {
  var cat = TREASURE_CATEGORIES.find(function(c) { return c.id === id; });
  return cat ? cat.color : '#888780';
}
function getCategoryLabel(id) {
  var cat = TREASURE_CATEGORIES.find(function(c) { return c.id === id; });
  return cat ? cat.label : '';
}

function renderTreasure(el) {
  el.innerHTML = topbar('💎 Skattkammaren', '<button class="btn btn-primary" onclick="openTreasureModal()">+ Lägg till</button>');
  const c = document.createElement('div');
  c.className = 'content';

  // Räkna och summera per kategori
  var catStats = {};
  TREASURE_CATEGORIES.forEach(function(cat) { catStats[cat.id] = { count: 0, saved: 0 }; });
  treasureItems.forEach(function(t) {
    if(t.category && catStats[t.category] !== undefined) {
      catStats[t.category].count++;
      if(t.original_price && t.paid_price) {
        catStats[t.category].saved += (t.original_price - t.paid_price);
      }
    }
  });

  // Juvelrad med SVG-diamanter
  var juvelRow = TREASURE_CATEGORIES.map(function(cat) {
    var stats = catStats[cat.id];
    return '<div style="text-align:center;padding:8px 2px;">'
      + diamondSVG(cat.color, 30)
      + '<div style="font-size:15px;font-weight:600;color:var(--text);margin-top:4px;">' + stats.count + '</div>'
      + '<div style="font-size:10px;color:var(--teal-light);min-height:14px;">' + (stats.saved > 0 ? stats.saved.toLocaleString('sv') + ' kr' : '') + '</div>'
      + '<div style="font-size:9px;color:var(--text-dim);margin-top:2px;line-height:1.3;">' + cat.label + '</div>'
      + '</div>';
  }).join('');

  c.innerHTML = ''
    + '<div class="card" style="margin-bottom:1rem;">'
    + '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;">' + juvelRow + '</div>'
    + '</div>'

    + '<div class="card">'
    + '<div class="card-title" style="margin-bottom:0.75rem;font-size:15px;">Mina smarta val</div>'
    + (treasureItems.length === 0
        ? '<div style="font-size:13px;color:var(--text-dim);text-align:center;padding:2rem 0;">Lägg till ditt första smarta val! 💎</div>'
        : treasureItems.map(function(t) {
            var saved = (t.original_price && t.paid_price) ? t.original_price - t.paid_price : null;
            var pct = saved && t.original_price ? Math.round(saved/t.original_price*100) : null;
            var color = getCategoryColor(t.category);
            return '<div style="padding:12px 0;border-top:0.5px solid var(--border);">'
              + '<div style="display:flex;align-items:flex-start;gap:10px;">'
              + '<div style="flex-shrink:0;margin-top:2px;">' + diamondSVG(color, 24) + '</div>'
              + '<div style="flex:1;">'
              + '<div style="font-size:13px;font-weight:500;color:var(--text);">' + (t.product||'—') + (pct ? ' <span style="font-size:11px;background:rgba(29,158,117,0.2);color:var(--teal-light);padding:2px 8px;border-radius:99px;">-' + pct + '%</span>' : '') + '</div>'
              + (t.shop ? '<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">' + t.shop + '</div>' : '')
              + '<div style="font-size:11px;color:var(--text-dim);margin-top:2px;">' + getCategoryLabel(t.category) + '</div>'
              + (saved ? '<div style="font-size:12px;color:var(--teal-light);margin-top:3px;font-weight:500;">Sparat: ' + saved.toLocaleString('sv') + ' kr</div>' : '')
              + (t.note ? '<div style="font-size:11px;color:var(--text-dim);margin-top:4px;">' + t.note + '</div>' : '')
              + (t.url ? '<a href="' + t.url + '" target="_blank" style="font-size:11px;color:var(--purple-pale);display:block;margin-top:4px;">🔗 Se mer</a>' : '')
              + '</div>'
              + '<button onclick="deleteTreasureItem(\'' + t.id + '\').then(()=>showView(\'treasure\'))" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;flex-shrink:0;">🗑️</button>'
              + '</div></div>';
          }).join(''))
    + '</div>';

  el.appendChild(c);
}

  const category = document.getElementById('tr-category').value;
  if(!category) { alert('Välj en kategori först!'); return; }
  const product = document.getElementById('tr-product').value.trim();
  if(!product) { alert('Berätta vad det är!'); return; }

  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;

  const item = {
    category,
    shop:           document.getElementById('tr-shop').value.trim(),
    product,
    original_price: parseInt(document.getElementById('tr-original').value) || null,
    paid_price:     parseInt(document.getElementById('tr-paid').value) || null,
    url:            document.getElementById('tr-url').value.trim(),
    note:           document.getElementById('tr-note').value.trim(),
    image_url:      null,

    document.getElementById('treasure-modal').remove();

<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Postkollen — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1E1A3A; --bg2: #272050; --bg3: #26215C;
      --purple: #534AB7; --purple-light: #7F77DD; --purple-pale: #AFA9EC; --purple-muted: #3C3489;
      --teal: #1D9E75; --teal-light: #9FE1CB;
      --text: #FFFFFF; --text-muted: #888780; --text-dim: #5F5E5A; --text-darker: #444441;
      --border: rgba(255,255,255,0.07);
      --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; height: 100vh; display: flex; overflow: hidden; }

    /* SIDEBAR */
    .sidebar { width: 220px; background: var(--bg2); border-right: 0.5px solid var(--border); display: flex; flex-direction: column; padding: 1.25rem 0.75rem; flex-shrink: 0; }
    .sidebar-logo { display: flex; align-items: center; gap: 9px; padding: 0 0.5rem 1.25rem; border-bottom: 0.5px solid var(--border); margin-bottom: 0.75rem; }
    .logo-text { font-size: 16px; font-weight: 500; color: #fff; letter-spacing: -0.3px; }
    .logo-text span { color: var(--purple-pale); }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--text-muted); cursor: pointer; transition: all 0.12s; font-size: 13px; margin-bottom: 2px; }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav-item.active { background: var(--bg3); color: var(--purple-pale); font-weight: 500; }
    .nav-item i { font-size: 16px; }
    .sidebar-bottom { margin-top: auto; border-top: 0.5px solid var(--border); padding-top: 0.75rem; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: var(--purple-pale); flex-shrink: 0; }

    /* MAIN */
    .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 0.5px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 10; }
    .topbar-title { font-size: 16px; font-weight: 500; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 7px; font-size: 13px; font-family: var(--font); cursor: pointer; transition: all 0.12s; border: none; }
    .btn-primary { background: var(--purple); color: #fff; }
    .btn-primary:hover { background: var(--purple-muted); }
    .btn-ghost { background: transparent; border: 0.5px solid var(--border); color: var(--text-muted); }
    .btn-ghost:hover { background: var(--bg2); color: var(--text); }
    .content { padding: 1.5rem; flex: 1; }

    /* METRICS */
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.25rem; }
    .metric { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; }
    .metric-label { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
    .metric-val { font-size: 22px; font-weight: 500; }
    .metric-sub { font-size: 11px; color: var(--text-darker); margin-top: 3px; }

    /* CARDS */
    .card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .card-title { font-size: 13px; font-weight: 500; color: var(--text); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* TABLE */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 11px; font-weight: 500; color: var(--text-dim); padding: 0 8px 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 10px 8px; border-top: 0.5px solid var(--border); color: var(--text-muted); vertical-align: middle; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .td-main { color: var(--text); }

    /* BADGES */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; white-space: nowrap; }
    .b-transit { background: rgba(55,138,221,0.15); color: #85B7EB; }
    .b-delivered { background: rgba(29,158,117,0.15); color: var(--teal-light); }
    .b-pending { background: rgba(186,117,23,0.15); color: #FAC775; }
    .b-customs { background: rgba(216,90,48,0.15); color: #F0997B; }

    /* DOT */
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    /* SEARCH */
    .search { display: flex; align-items: center; gap: 8px; background: var(--bg3); border: 0.5px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 1rem; }
    .search input { background: transparent; border: none; outline: none; font-size: 13px; color: var(--text); font-family: var(--font); flex: 1; }
    .search input::placeholder { color: var(--text-darker); }

    /* FILTERS */
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
    .filter { padding: 5px 12px; border-radius: 99px; font-size: 12px; border: 0.5px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font-family: var(--font); transition: all 0.12s; }
    .filter.active { background: var(--bg3); color: var(--purple-pale); border-color: var(--purple-light); }

    /* NOTIF */
    .notif { display: flex; gap: 10px; padding: 10px 0; border-top: 0.5px solid var(--border); align-items: flex-start; }
    .notif:first-child { border-top: none; }
    .notif-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .ni-green { background: rgba(29,158,117,0.15); }
    .ni-blue { background: rgba(55,138,221,0.15); }
    .ni-amber { background: rgba(186,117,23,0.15); }
    .ni-red { background: rgba(226,75,74,0.15); }
    .notif-body { font-size: 13px; color: var(--text); line-height: 1.5; }
    .notif-time { font-size: 11px; color: var(--text-darker); margin-top: 2px; }

    /* INVOICE */
    .inv-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-top: 0.5px solid var(--border); }
    .inv-row:first-child { border-top: none; }
    .inv-name { font-size: 13px; color: var(--text); }
    .inv-meta { font-size: 11px; color: var(--text-darker); margin-top: 2px; }
    .inv-amount { font-size: 14px; font-weight: 500; }
    .amt-out { color: #F09595; }
    .amt-in { color: var(--teal-light); }
    .inv-due { font-size: 11px; color: var(--text-darker); text-align: right; margin-top: 2px; }

    /* FORM */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 14px; padding: 1.5rem; width: 460px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 16px; font-weight: 500; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; }
    .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; line-height: 1; }
    .tabs { display: flex; gap: 4px; background: var(--bg3); border-radius: 8px; padding: 4px; margin-bottom: 1.25rem; }
    .tab { flex: 1; padding: 7px; text-align: center; font-size: 12px; color: var(--text-dim); border-radius: 6px; cursor: pointer; font-family: var(--font); border: none; background: transparent; transition: all 0.12s; }
    .tab.active { background: var(--bg2); color: var(--purple-pale); font-weight: 500; }
    .field { margin-bottom: 12px; }
    .field label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px; }
    .field input, .field select, .field textarea { width: 100%; background: var(--bg3); border: 0.5px solid rgba(255,255,255,0.1); border-radius: 7px; padding: 9px 12px; font-size: 13px; color: var(--text); font-family: var(--font); outline: none; transition: border-color 0.12s; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--purple-light); }
    .field input::placeholder, .field textarea::placeholder { color: var(--text-darker); }
    .field select option { background: var(--bg2); }
    .field textarea { min-height: 60px; resize: none; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .carrier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .carrier-chip { border: 0.5px solid var(--border); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; font-size: 11px; color: var(--text-muted); font-family: var(--font); background: transparent; transition: all 0.12s; }
    .carrier-chip.sel { border-color: var(--purple-light); background: var(--bg3); color: var(--purple-pale); }
    .mono { font-family: var(--mono); }
    .recognized { display: inline-block; font-size: 10px; background: rgba(29,158,117,0.2); color: var(--teal-light); padding: 2px 7px; border-radius: 99px; margin-left: 8px; }

    /* SETTINGS */
    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 0.5px solid var(--border); }
    .setting-row:first-child { border-top: none; }
    .toggle { width: 36px; height: 20px; border-radius: 99px; cursor: pointer; position: relative; transition: background 0.2s; border: none; flex-shrink: 0; }
    .toggle.on { background: var(--purple); }
    .toggle.off { background: var(--bg3); }
    .toggle::after { content:''; position: absolute; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: white; transition: left 0.2s; }
    .toggle.on::after { left: 18px; }
    .toggle.off::after { left: 2px; }

    /* ── MOBILANPASSNING ── */
    @media (max-width: 768px) {
      /* Dölj sidomenyn på mobil */
      .sidebar { display: none; }

      /* Huvudinnehåll tar hela bredden */
      body { flex-direction: column; }
      .app { flex-direction: column; height: 100vh; }
      .main { flex: 1; overflow-y: auto; padding-bottom: 70px; }

      /* Nedre navigationsmeny */
      .bottom-nav {
        display: flex !important;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--bg2);
        border-top: 0.5px solid var(--border);
        z-index: 100;
        height: 60px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .bottom-nav::-webkit-scrollbar { display: none; }
      .bottom-nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        cursor: pointer;
        font-size: 10px;
        color: var(--text-muted);
        padding: 6px 2px;
        border: none;
        background: transparent;
        font-family: var(--font);
        transition: color 0.12s;
      }
      .bottom-nav-item.active { color: var(--purple-pale); }
      .bottom-nav-item span { font-size: 20px; }

      /* Metriker — 2 kolumner på mobil */
      .metrics { grid-template-columns: 1fr 1fr !important; }

      /* Två kolumner → en kolumn */
      .two-col { grid-template-columns: 1fr !important; }

      /* Topbar */
      .topbar { padding: 0.75rem 1rem; }
      .topbar-title { font-size: 15px; }

      /* Content padding */
      .content { padding: 1rem; }

      /* Snabbknappar — 4 i rad men mindre */
      .content > div:first-child button { padding: 10px 6px !important; }

      /* Modal full-bredd på mobil */
      .modal { width: 95vw; padding: 1.25rem; }

      /* Tabell — dölj några kolumner */
      table th:nth-child(4),
      table td:nth-child(4),
      table th:nth-child(5),
      table td:nth-child(5),
      table th:nth-child(6),
      table td:nth-child(6) { display: none; }

      /* Temaknapp */
      .theme-toggle { bottom: 70px; }
    }

    @media (min-width: 769px) {
      .bottom-nav { display: none; }
    }
      /* Hem-knapp i topbar på mobil */
      .home-btn { display: none; }
      @media (max-width: 768px) {
        .home-btn { display: inline-flex !important; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 8px; background: var(--bg3); border: none; color: var(--purple-pale); font-size: 18px; cursor: pointer; flex-shrink: 0; }
      }
  </style>

// ── DATA ──
const CARRIERS = {PostNord:'#D85A30',DHL:'#EF9F27',UPS:'#633806',FedEx:'#185FA5',Budbee:'#1D9E75',Instabox:'#534AB7',Vinted:'#09B1BA',Marketplace:'#1877F2',Tradera:'#E8392A',Earlybird:'#FF6B35',Annat:'#888780'};

  {id:5,name:'Privatkund – retur',ref:'INV-2024-038',amount:800,type:'in',due:'30 maj',paid:false},

let notifications = [
  {type:'green',icon:'✓',text:'Zalando-paket levererat till brevlådan',time:'Idag 09:14 · PostNord'},
  {type:'blue',icon:'🚚',text:'DHL-försändelse anlände till terminal i Göteborg',time:'Idag 07:30 · DHL'},
  {type:'red',icon:'!',text:'Faktura från PostNord förfaller om 3 dagar',time:'Igår 12:00'},
  {type:'amber',icon:'⏸',text:'Tullstop — komplettering kan behövas',time:'Igår 18:55 · UPS'},
  {type:'green',icon:'✓',text:'Betalning mottagen från Kund AB',time:'25 apr · 3 200 kr'},
  {type:'blue',icon:'🚚',text:'FedEx-paket avgick från Chicago',time:'28 apr · FedEx'},
];

let toggles = {delivery:true,customs:true,invoices:true,weekly:false};
let activeFilter = 'Alla';

let selectedCarrierMVal = 'PostNord';
let nextId = 6;
let currentView = 'dashboard';




// ── MITT HUS ──
const ALL_CARRIERS = [
  {name:'PostNord', color:'#D85A30', desc:'Paket & Brev'},
  {name:'DHL', color:'#EF9F27', desc:'Express & Utrikes'},
  {name:'UPS', color:'#633806', desc:'Paket & Utrikes'},
  {name:'FedEx', color:'#185FA5', desc:'Flyg & Utrikes'},
  {name:'Budbee', color:'#1D9E75', desc:'Snabb leverans'},
  {name:'Instabox', color:'#534AB7', desc:'Paketbox'},
  {name:'Earlybird', color:'#FF6B35', desc:'Snabb & lokal'},
  {name:'Vinted', color:'#09B1BA', desc:'Kläder & Begagnat'},
  {name:'Tradera', color:'#E8392A', desc:'Auktion & Sälj'},
  {name:'Marketplace', color:'#1877F2', desc:'Lokal & Köp/Sälj'},
  {name:'Valfritt', color:'#888780', desc:'Välj själv'},

let myWindows = ['PostNord','DHL','UPS','FedEx','Vinted','Tradera','Marketplace','Earlybird'];

async function loadMyHouse() {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const { data, error } = await _supa.from('house_windows').select('*').eq('user_id', session.user.id).single();
  if(!error && data && data.windows && data.windows.length > 0) {
    myWindows = data.windows;
  }
}

async function saveMyHouse() {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  await _supa.from('house_windows').upsert({
    user_id: session.user.id,
    windows: myWindows,
    updated_at: new Date().toISOString()
  });
}

function renderMyHouse(el) {
  el.innerHTML = topbar('🏠 Mitt hus');
  const c = document.createElement('div');
  c.className = 'content';

  const rows = [];
  for(let i=0; i<myWindows.length; i+=4) rows.push(myWindows.slice(i,i+4));

  c.innerHTML = `
    <div class="card" style="margin-bottom:1rem;">
      <div class="card-title">Ditt hus</div>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:1rem;">Här ser du dina valda transportörer och plattformar. Klicka på ett fönster för att byta ut det, eller lägg till fler!</p>

      <div style="background:#1E1A3A;border-radius:12px;padding:1.5rem;position:relative;overflow:hidden;">
        <!-- Tak -->
        <div style="text-align:center;margin-bottom:-8px;">
          <svg width="100%" viewBox="0 0 400 80" style="display:block;">
            <polygon points="200,5 10,75 390,75" fill="#3C3489" stroke="#534AB7" stroke-width="1"/>
            <line x1="10" y1="75" x2="390" y2="75" stroke="#7F77DD" stroke-width="1.5"/>
            <rect x="260" y="30" width="20" height="40" fill="#2D2570" stroke="#534AB7" stroke-width="0.5"/>
            <rect x="257" y="27" width="26" height="6" rx="1" fill="#534AB7"/>
          </svg>
        </div>

        <!-- Fönster/väggar -->
        <div style="background:#26215C;border-radius:0 0 8px 8px;padding:1rem;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;" id="house-windows">
          ${myWindows.map((name,i) => {
            const c = ALL_CARRIERS.find(x=>x.name===name) || {name,color:'#888780',desc:'Plattform'};
            return `<div onclick="editWindow(${i})" style="background:${c.color};border-radius:6px;padding:8px 4px;text-align:center;cursor:pointer;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:opacity 0.15s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">
              <div style="font-size:10px;font-weight:500;color:#fff;">${c.name}</div>
              <div style="font-size:9px;color:rgba(255,255,255,0.7);">${c.desc}</div>
            </div>`;
          }).join('')}
          ${myWindows.length < 12 ? `<div onclick="addWindow()" style="background:#26215C;border:1px dashed #534AB7;border-radius:6px;padding:8px 4px;text-align:center;cursor:pointer;min-height:60px;display:flex;align-items:center;justify-content:center;color:#534AB7;font-size:20px;" onmouseover="this.style.borderColor='#7F77DD'" onmouseout="this.style.borderColor='#534AB7'">+</div>` : ''}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Lägg till eller byt fönster</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
        ${ALL_CARRIERS.map(c => `
        <div onclick="toggleCarrierInHouse('${c.name}')" style="border:0.5px solid ${myWindows.includes(c.name)?c.color:'var(--border)'};background:${myWindows.includes(c.name)?c.color+'22':'transparent'};border-radius:8px;padding:8px;cursor:pointer;text-align:center;transition:all 0.15s;">
          <div style="display:flex;align-items:center;justify-content:center;gap:5px;">
            <div style="width:8px;height:8px;border-radius:50%;background:${c.color};flex-shrink:0;"></div>
            <div style="font-size:12px;color:var(--text);font-weight:${myWindows.includes(c.name)?'500':'400'};">${c.name}</div>
            ${myWindows.includes(c.name)?'<div style="color:#1D9E75;font-size:12px;">✓</div>':''}
          </div>
        </div>`).join('')}
      </div>
    </div>`;
  el.appendChild(c);
}

function editWindow(i) {
  myWindows.splice(i, 1);
  saveMyHouse();
  showView('myhouse');
}

function addWindow() {
  var available = ALL_CARRIERS.map(c=>c.name).filter(n=>!myWindows.includes(n));
  if(available.length === 0) { alert('Alla transportörer finns redan i ditt hus!'); return; }
  myWindows.push(available[0]);
  saveMyHouse();
  showView('myhouse');
}

function toggleCarrierInHouse(name) {
  if(myWindows.includes(name)) {
    if(myWindows.length <= 1) { alert('Du måste ha minst ett fönster!'); return; }
    myWindows = myWindows.filter(n=>n!==name);
  } else {
    if(myWindows.length >= 12) { alert('Huset har plats för max 12 fönster!'); return; }
    myWindows.push(name);
  }
  saveMyHouse();
  showView('myhouse');
}

// ── ÖNSKELISTOR ──
let wishlists = [];
let nextWishId = 1;

async function loadWishlists() {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const { data, error } = await _supa.from('wishlists').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false });
  if(!error && data) {
    wishlists = data;
    if(currentView === 'wishlists') showView('wishlists');
  }
}

function renderWishlists(el) {
  el.innerHTML = `<div class="topbar"><div style="display:flex;align-items:center;gap:10px;"><button class="home-btn" onclick="showView('dashboard')" title="Hem">⌂</button><div class="topbar-title">💝 Önskelistor</div></div><button class="btn btn-primary" onclick="openWishModal()">+ Lägg till önskemål</button></div>
  <div class="content">
    <div class="card" style="margin-bottom:1rem;">
      <div class="card-title">Översikt</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
        <div class="metric"><div class="metric-label">Totalt</div><div class="metric-val">${wishlists.length}</div></div>
        <div class="metric"><div class="metric-label">Köpt</div><div class="metric-val" style="color:var(--teal-light);">${wishlists.filter(w=>w.bought).length}</div></div>
        <div class="metric"><div class="metric-label">Kvar</div><div class="metric-val" style="color:#FAC775;">${wishlists.filter(w=>!w.bought).length}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Alla önskemål</div>
      <div class="search" style="margin-bottom:0.75rem;">
        <span style="color:var(--text-dim);font-size:15px;">🔍</span>
        <input placeholder="Sök på namn eller önskemål…" oninput="filterWishlists(this.value)" style="background:transparent;border:none;outline:none;font-size:13px;color:var(--text);flex:1;font-family:inherit;" />
      </div>
      <div style="display:flex;gap:8px;margin-bottom:0.75rem;">
        <button onclick="setWishFilter('all')" id="wf-all" class="filter active">Alla</button>
        <button onclick="setWishFilter('pending')" id="wf-pending" class="filter">Ej köpt</button>
        <button onclick="setWishFilter('bought')" id="wf-bought" class="filter">Köpt</button>
      </div>
      <div id="wish-list">${renderWishRows(wishlists)}</div>
    </div>
  </div>

  <div id="wish-modal" style="display:none;" class="modal-bg">
    <div class="modal">
      <div class="modal-title">Lägg till önskemål <button class="close-btn" onclick="closeWishModal()">✕</button></div>
      <div class="field"><label>Vem önskar sig detta?</label><input id="w-person" placeholder="t.ex. Emma, pappa, Johan" /></div>
      <div class="field"><label>Önskemål</label><input id="w-wish" placeholder="t.ex. parfym, bok om trädgård, presentkort" /></div>
      <div class="field"><label>Tillfälle (valfritt)</label><input id="w-occasion" placeholder="t.ex. Födelsedag, Högtid" /></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="field"><label>Ungefärligt pris (kr)</label><input id="w-price" type="number" placeholder="0" /></div>
        <div class="field"><label>Länk / butik (valfritt)</label><input id="w-link" placeholder="t.ex. zalando.se" /></div>
      </div>
      <div class="field"><label>Notering (valfritt)</label><textarea id="w-note" placeholder="Extra info om önskemålet…" style="width:100%;background:var(--bg3);border:0.5px solid rgba(255,255,255,0.1);border-radius:7px;padding:9px 12px;font-size:13px;color:var(--text);font-family:inherit;outline:none;min-height:60px;resize:none;"></textarea></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;" onclick="saveWish()">Spara önskemål</button>
    </div>
  </div>`;
}

var wishFilter = 'all';
var wishSearch = '';

function setWishFilter(f) {
  wishFilter = f;
  ['all','pending','bought'].forEach(x => {
    var el = document.getElementById('wf-'+x);
    if(el) el.className = 'filter' + (x===f?' active':'');
  });
  updateWishList();
}

function filterWishlists(q) {
  wishSearch = q.toLowerCase();
  updateWishList();
}

function updateWishList() {
  let list = wishlists;
  if(wishFilter === 'pending') list = list.filter(w=>!w.bought);
  if(wishFilter === 'bought') list = list.filter(w=>w.bought);
  if(wishSearch) list = list.filter(w => w.person.toLowerCase().includes(wishSearch) || w.wish.toLowerCase().includes(wishSearch));
  var el = document.getElementById('wish-list');
  if(el) el.innerHTML = renderWishRows(list);
}

function renderWishRows(list) {
  if(list.length === 0) return '<div style="font-size:13px;color:var(--text-dim);padding:1rem 0;text-align:center;">Inga önskemål här</div>';
  return list.map(w => `
  <div style="border-top:0.5px solid var(--border);padding:12px 0;display:flex;align-items:flex-start;gap:12px;">
    <button onclick="toggleBought('${w.id}')" style="width:22px;height:22px;border-radius:6px;border:1.5px solid ${w.bought?'var(--teal)':'var(--border)'};background:${w.bought?'var(--teal)':'transparent'};cursor:pointer;flex-shrink:0;margin-top:2px;font-size:12px;color:white;">
      ${w.bought?'✓':''}
    </button>
    <div style="flex:1;${w.bought?'opacity:0.5;text-decoration:line-through;':''}">
      <div style="font-size:13px;font-weight:500;color:var(--text);">${w.person}${w.occasion?' — '+w.occasion:''}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${w.wish}</div>
      ${w.note?`<div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${w.note}</div>`:''}
      ${w.link?`<div style="font-size:11px;color:var(--purple-pale);margin-top:2px;">🔗 ${w.link}</div>`:''}
    </div>
    <div style="text-align:right;flex-shrink:0;">
      ${w.price?`<div style="font-size:13px;font-weight:500;color:var(--text);">~${w.price} kr</div>`:''}
      <button onclick="deleteWish('${w.id}')" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:4px;" title="Ta bort">🗑️</button>
    </div>
  </div>`).join('');
}

function openWishModal() {
  var modal = document.getElementById('wish-modal');
  if(modal) {
    modal.style.display = 'flex';
    ['w-person','w-wish','w-occasion','w-link','w-note'].forEach(id => { var el=document.getElementById(id); if(el) el.value=''; });
    var price = document.getElementById('w-price'); if(price) price.value='';
  }
}

function closeWishModal() {
  var modal = document.getElementById('wish-modal');
  if(modal) modal.style.display = 'none';
}

async function saveWish() {
  const person = document.getElementById('w-person').value.trim();
  const wish = document.getElementById('w-wish').value.trim();
  if(!person || !wish) { alert('Fyll i vem och vad de önskar sig.'); return; }

  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;

  const { data, error } = await _supa.from('wishlists').insert([{
    user_id: session.user.id,
    person,
    wish,
    occasion: document.getElementById('w-occasion').value.trim(),
    price: parseFloat(document.getElementById('w-price').value) || 0,
    link: document.getElementById('w-link').value.trim(),
    note: document.getElementById('w-note').value.trim(),
    bought: false
  }]).select();

  if(error) { alert('Kunde inte spara: ' + error.message); return; }
  wishlists.unshift(data[0]);
  closeWishModal();
  showView('wishlists');
}

async function toggleBought(id) {
  const w = wishlists.find(x => x.id == id);
  if(!w) return;
  const newVal = !w.bought;
  const { error } = await _supa.from('wishlists').update({ bought: newVal }).eq('id', id);
  if(!error) {
    w.bought = newVal;
    updateWishList();
  }
}

// ── PRESENTER ──
let presents = [];
let nextPresentId = 1;


function renderFeedback(el) {
  el.innerHTML = `<div class="topbar"><div style="display:flex;align-items:center;gap:10px;"><button class="home-btn" onclick="showView('dashboard')" title="Hem">⌂</button><div class="topbar-title">💬 Feedback</div></div></div>
  <div class="content">
    <div class="card" style="max-width:500px;margin:0 auto;">
      <div class="card-title">Vad tycker du om Postkollen?</div>
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:1.25rem;">Din feedback hjälper oss bli bättre!</div>
      <div style="display:flex;gap:12px;justify-content:center;margin-bottom:1.5rem;">
        <button id="fb-up" onclick="setFeedbackThumb('up')" style="width:52px;height:52px;border-radius:12px;border:0.5px solid var(--border);background:transparent;font-size:24px;cursor:pointer;transition:all 0.15s;">👍</button>
        <button id="fb-down" onclick="setFeedbackThumb('down')" style="width:52px;height:52px;border-radius:12px;border:0.5px solid var(--border);background:transparent;font-size:24px;cursor:pointer;transition:all 0.15s;">👎</button>
      </div>
      <div class="field">
        <label>Kommentar (valfritt)</label>
        <textarea id="fb-text" placeholder="Berätta mer — vad funkar bra eller kan bli bättre?" style="width:100%;background:var(--bg3);border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--text);font-family:inherit;outline:none;min-height:100px;resize:none;"></textarea>
      </div>
      <button onclick="sendAppFeedback()" style="width:100%;padding:11px;background:var(--purple);border:none;border-radius:8px;color:#fff;font-size:14px;font-family:inherit;cursor:pointer;margin-top:4px;">Skicka feedback</button>
      <div id="fb-thanks" style="display:none;font-size:13px;color:var(--teal-light);text-align:center;margin-top:12px;">Tack för din feedback! 🙏</div>
    </div>
  </div>`;
}

var fbThumb = null;
function setFeedbackThumb(t) {
  fbThumb = t;
  var up = document.getElementById('fb-up');
  var down = document.getElementById('fb-down');
  if(up) up.style.background = t==='up' ? 'rgba(29,158,117,0.2)' : 'transparent';
  if(down) down.style.background = t==='down' ? 'rgba(226,75,74,0.2)' : 'transparent';
}
function sendAppFeedback() {
  if(!fbThumb) { alert('Välj tumme upp eller ner först!'); return; }
  document.getElementById('fb-thanks').style.display = 'block';
  document.getElementById('fb-text').value = '';
  fbThumb = null;
  setTimeout(() => { document.getElementById('fb-thanks').style.display = 'none'; }, 3000);
}

function getPresentRows(list) {
  if(list.length === 0) return '<div style="font-size:13px;color:var(--text-dim);padding:1rem 0;text-align:center;">Inga presenter hittades</div>';
  return list.map(p => `
  <div style="border-top:0.5px solid var(--border);padding:12px 0;display:flex;align-items:flex-start;gap:12px;">
    <div style="flex:1;">
      <div style="font-size:13px;font-weight:500;color:var(--text);">${p.recipient} — ${p.occasion}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${p.gift}${p.supplier ? ' · ' + p.supplier : ''}</div>
      ${p.reaction ? '<div style="font-size:11px;color:var(--teal-light);margin-top:3px;">💬 ' + p.reaction + '</div>' : ''}
      ${p.tip ? '<div style="font-size:11px;color:#FAC775;margin-top:3px;">💡 Nästa gång: ' + p.tip + '</div>' : ''}
    </div>
    <div style="text-align:right;flex-shrink:0;">
      <div style="font-size:14px;font-weight:500;color:var(--text);">${p.amount ? p.amount.toLocaleString('sv') + ' kr' : '—'}</div>
      <div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${p.date || ''}</div>
      <button onclick="deletePresent('${p.id}')" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:4px;" title="Ta bort">🗑️</button>
    </div>
  </div>`).join('');
}

function filterPresents() {
  const q = document.getElementById('p-search')?.value.toLowerCase() || '';
  const year = document.getElementById('p-year')?.value || '';
  const occ = document.getElementById('p-occ')?.value || '';
  let list = presents;
  if(q) list = list.filter(p => p.recipient.toLowerCase().includes(q) || p.occasion.toLowerCase().includes(q) || p.gift.toLowerCase().includes(q));
  if(year) list = list.filter(p => p.date && p.date.startsWith(year));
  if(occ) list = list.filter(p => p.occasion.toLowerCase().includes(occ.toLowerCase()));
  const tbody = document.getElementById('present-list');
  if(tbody) tbody.innerHTML = getPresentRows(list);

function openPresentModal() {
  const modal = document.getElementById('present-modal');
  if(modal) modal.style.display = 'flex';
}

function closePresentModal() {
  const modal = document.getElementById('present-modal');
  if(modal) modal.style.display = 'none';
}

async function savePresent() {
  const recipient = document.getElementById('p-recipient').value.trim();
  const gift = document.getElementById('p-gift').value.trim();
  if(!recipient || !gift) { alert('Fyll i mottagare och gåva.'); return; }

  const { data: { session } } = await _supa.auth.getSession();
  if(!session) { alert('Du måste vara inloggad.'); return; }

  const { data, error } = await _supa.from('presents').insert([{
    user_id: session.user.id,
    recipient,
    occasion: document.getElementById('p-occasion').value.trim(),
    gift,
    amount: parseFloat(document.getElementById('p-amount').value) || 0,
    date: document.getElementById('p-date').value,
    supplier: document.getElementById('p-supplier').value.trim(),
    reaction: document.getElementById('p-reaction').value.trim(),
    tip: document.getElementById('p-tip').value.trim()
  }]).select();

  if(error) { alert('Kunde inte spara: ' + error.message); return; }

  const p = { ...data[0] };
  presents.unshift(p);
  notifications.unshift({t:'green',i:'🎁',text:`Present till ${recipient} sparad`,time:'Precis nu'});
  closePresentModal();
  showView('presents');
}

function showViewMobile(v) {
  showView(v);
  // Uppdatera aktiv knapp i bottom-nav
  ['dashboard','shipments','invoices','presents','wishlists'].forEach(name => {
    var btn = document.getElementById('bn-' + (name === 'wishlists' ? 'more' : name));
    if(btn) btn.className = 'bottom-nav-item' + (name === v ? ' active' : '');
  });
}

function showView(v) {
  currentView = v;
  // Uppdatera bottom-nav aktiv knapp
  ['dashboard','shipments','invoices','presents'].forEach(name => {
    var btn = document.getElementById('bn-' + name);
    if(btn) btn.className = 'bottom-nav-item' + (name === v ? ' active' : '');
  });
  var moreBtn = document.getElementById('bn-more');
  if(moreBtn) moreBtn.className = 'bottom-nav-item' + (v === 'wishlists' || v === 'notifications' || v === 'feedback' || v === 'settings' ? ' active' : '');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const items = document.querySelectorAll('.nav-item');
  const map = {dashboard:0,myhouse:1,shipments:2,invoices:3,notifications:4,presents:5,wishlists:6,feedback:7,settings:8};
  if(items[map[v]]) items[map[v]].classList.add('active');
  const main = document.getElementById('main');
  main.innerHTML = '';

  if(v==='dashboard') renderDashboard(main);
  else if(v==='shipments') renderShipments(main);
  else if(v==='invoices') renderInvoices(main);
  else if(v==='notifications') renderNotifications(main);
  else if(v==='myhouse') renderMyHouse(main);
  else if(v==='presents') renderPresents(main);
  else if(v==='wishlists') renderWishlists(main);
  else if(v==='feedback') renderFeedback(main);
  else if(v==='settings') renderSettings(main);
}

function topbar(title, btn='') {

  return `<div class="topbar">

    </div>
    ${btn}
  </div>`;
}

async function deletePresent(id) {
  if(!confirm('Ta bort den här presenten?')) return;
  const { error } = await _supa.from('presents').delete().eq('id', id);
  if(!error) { presents = presents.filter(p => p.id != id); showView('presents'); }
}

async function deleteWish(id) {
  if(!confirm('Ta bort det här önskemålet?')) return;
  const { error } = await _supa.from('wishlists').delete().eq('id', id);
  if(!error) { wishlists = wishlists.filter(w => w.id != id); showView('wishlists'); }

async function deleteInvoice(id) {
  if(!confirm('Ta bort den här posten?')) return;

  if(!confirm('Vill du ta bort den här försändelsen?')) return;

  if(error) { alert('Kunde inte ta bort: ' + error.message); return; }
  shipments = shipments.filter(s => s.id != id);
  showView('shipments');
}

function toggleSetting(k) {
  toggles[k] = !toggles[k];

// ── MODAL ──
function openModal() {
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}
function switchModalTab(t) {
  modalTab = t;
  document.getElementById('tab-track').classList.toggle('active', t==='track');
  document.getElementById('tab-manual').classList.toggle('active', t==='manual');
  document.getElementById('modal-track').style.display = t==='track'?'block':'none';
  document.getElementById('modal-manual').style.display = t==='manual'?'block':'none';
}

function selectCarrier(el, name) {
  document.querySelectorAll('#carrier-grid .carrier-chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  selectedCarrierVal = name;
  const w = document.getElementById('annat-wrap');
  if(w) w.style.display = name==='Annat' ? 'block' : 'none';
}
function selectCarrierM(el, name) {
  document.querySelectorAll('#carrier-grid-m .carrier-chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  selectedCarrierMVal = name;
  const w = document.getElementById('annat-wrap-m');
  if(w) w.style.display = name==='Annat' ? 'block' : 'none';
}

function onTrack(v) {
  const r = document.getElementById('recognized');
  const known = /^SE\d{8,}SE$/i.test(v) || /^1Z[A-Z0-9]{15,}/i.test(v) || /^\d{20}$/.test(v);
  r.style.display = known ? 'inline-block' : 'none';
  if(/^SE/i.test(v)) { document.querySelectorAll('#carrier-grid .carrier-chip')[0].click(); }
  else if(/^1Z/i.test(v)) { document.querySelectorAll('#carrier-grid .carrier-chip')[2].click(); }
}

async function addShipment() {
  let name, carrier, track, status='pending', eta='Okänt', cost=0, costType='Utgift', note='';

  if(modalTab==='track') {
    track = document.getElementById('track-nr').value.trim();
    name = document.getElementById('track-name').value.trim() || track;
    if(!track) { alert('Fyll i ett spårningsnummer.'); return; }
    carrier = selectedCarrierVal;
    if(carrier==='Annat') {
      const custom = document.getElementById('annat-name').value.trim();
      if(!custom) { alert('Ange namn på transportör/plattform.'); return; }
      carrier = custom;
      if(!CARRIERS[carrier]) CARRIERS[carrier] = '#888780';
    }
    cost = parseFloat(document.getElementById('track-cost').value)||0;
    costType = document.getElementById('track-type').value;
    note = document.getElementById('track-note').value;
  } else {
    name = document.getElementById('m-desc').value.trim();
    if(!name) { alert('Fyll i en beskrivning.'); return; }
    carrier = selectedCarrierMVal;
    if(carrier==='Annat') {
      const custom = document.getElementById('annat-name-m').value.trim();
      if(!custom) { alert('Ange namn på transportör/plattform.'); return; }
      carrier = custom;
      if(!CARRIERS[carrier]) CARRIERS[carrier] = '#888780';
    }
    track = 'Manuell';
    eta = document.getElementById('m-eta').value || 'Okänt';
    cost = parseFloat(document.getElementById('m-cost').value)||0;
    costType = document.getElementById('m-type').value;
    note = document.getElementById('m-note').value;
  }

  // Hämta inloggad användare
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) { alert('Du måste vara inloggad.'); return; }

  // Spara i Supabase
  const { data, error } = await _supa.from('shipments').insert([{
    user_id: session.user.id,
    name, carrier, track, status, eta,
    cost, cost_type: costType, note
  }]).select();

  if(error) { alert('Kunde inte spara försändelsen: ' + error.message); return; }

  // Lägg till lokalt också
  const s = { id: data[0].id, name, carrier, track, status, eta, cost, costType, note };
  shipments.unshift(s);
  notifications.unshift({t:'blue',i:'📦',text:`${name} tillagd`,time:'Precis nu'});
  closeModal();
  showView(currentView);
}





function openInvoiceModal() {
  var existing = document.getElementById('invoice-modal');
  if(existing) {
    existing.style.display='flex';
    existing.querySelector('#inv-name').value='';
    existing.querySelector('#inv-ref').value='';
    existing.querySelector('#inv-amount').value='';
    existing.querySelector('#inv-due').value='';
    return;
  }
  var modal = document.createElement('div');
  modal.id = 'invoice-modal';
  modal.className = 'modal-bg';
  modal.style.display = 'flex';
  modal.innerHTML = `<div class="modal">
    <div class="modal-title">Lägg till kostnad <button class="close-btn" onclick="document.getElementById('invoice-modal').style.display='none'">✕</button></div>
    <div class="field"><label>Beskrivning</label><input id="inv-name" placeholder="t.ex. PostNord fraktkostnad" /></div>
    <div class="field"><label>Referens (valfritt)</label><input id="inv-ref" placeholder="t.ex. spårningsnummer" /></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="field"><label>Belopp (kr)</label><input id="inv-amount" type="number" placeholder="0" /></div>
      <div class="field"><label>Förfallodatum</label><input id="inv-due" type="date" /></div>
    </div>

      <select id="inv-type" style="width:100%;background:var(--bg3);border:0.5px solid rgba(255,255,255,0.1);border-radius:7px;padding:9px 12px;font-size:13px;color:var(--text);font-family:inherit;outline:none;">
        <option value="out">Utgift — att betala</option>

      </select>

    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;" onclick="saveInvoice()">Spara</button>
  </div>`;

}

async function saveInvoice() {
  const name = document.getElementById('inv-name').value.trim();
  const amount = parseFloat(document.getElementById('inv-amount').value) || 0;
  if(!name) { alert('Fyll i en beskrivning.'); return; }
  const ref = document.getElementById('inv-ref').value.trim();
  const due = document.getElementById('inv-due').value || 'Okänt';
  const type = document.getElementById('inv-type').value;
  await addInvoice(name, ref, amount, type, due);
  document.getElementById('invoice-modal').style.display = 'none';
  notifications.unshift({t:'amber',i:'🧾',text:`${name} tillagd`,time:'Precis nu'});
  showView('invoices');
}

async function loadInvoices() {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const { data, error } = await _supa.from('invoices').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false });
  if(!error && data) {
    invoices = data.map(i => ({
      id: i.id,
      name: i.name,
      ref: i.ref,
      amount: i.amount || 0,
      type: i.type || 'out',
      due: i.due || 'Okänt',
      paid: i.paid || false
    }));
    if(currentView === 'invoices') showView('invoices');
  }
}

async function addInvoice(name, ref, amount, type, due) {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const { data, error } = await _supa.from('invoices').insert([{
    user_id: session.user.id,
    name, ref, amount, type, due, paid: false
  }]).select();
  if(!error && data) {
    invoices.unshift({
      id: data[0].id,
      name, ref, amount, type, due, paid: false
    });
  }
}

async function loadPresents() {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const { data, error } = await _supa.from('presents').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false });
  if(!error && data) {
    presents = data;
    if(currentView === 'presents') showView('presents');
  }
}

async function loadShipments() {
  const { data: { session } } = await _supa.auth.getSession();
  if(!session) return;
  const { data, error } = await _supa.from('shipments').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false });
  if(!error && data) {
    ships = data.map(s => ({
      id: s.id,
      name: s.name,
      carrier: s.carrier,
      track: s.track,
      status: s.status || 'pending',
      eta: s.eta || 'Okänt',
      cost: s.cost || 0,
      costType: s.cost_type || 'Utgift',
      note: s.note || ''
    }));
    showView(currentView);
  }
}

<script>
function toggleTheme() {
  var body = document.body;
  var btn = document.getElementById('theme-btn');
  if(body.classList.contains('light')) {
    body.classList.remove('light');
    btn.textContent = '🌙';
    localStorage.setItem('pk-theme', 'dark');
  } else {
    body.classList.add('light');
    btn.textContent = '☀️';
    localStorage.setItem('pk-theme', 'light');
  }
}
// Återställ valt tema
if(localStorage.getItem('pk-theme') === 'light') {
  document.body.classList.add('light');
  document.getElementById('theme-btn') && (document.getElementById('theme-btn').textContent = '☀️');
}
